<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">How belief moves a price</title>
<desc id="desc">The price of a growing stream of payments, as a multiple of next annual payment, plotted against expected growth from 0 to 8 percent, with the future discounted at 8 percent. The curve rises slowly, then steeply, and has no ceiling as growth approaches the 8 percent discount rate, marked by a dashed vertical line. At 4 percent growth the price is 25 times the payment, at 6 percent 50 times, at 7 percent 100 times. One point of extra belief, from 6 to 7 percent, doubles the price; falling back from 7 to 4 percent cuts it by three-quarters. Illustrative values.</desc>
<rect width="1000" height="600" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717;text-anchor:middle}.title{font-size:28px;font-weight:700}.label{font-size:18px}.small{font-size:16px;fill:#444}.tick{font-size:16px;fill:#444}.axis{stroke:#222;stroke-width:2;fill:none}.grid{stroke:#e4e4e4;stroke-width:1}.curve{stroke:#111;stroke-width:3.4;fill:none}.wall{stroke:#666;stroke-width:2;stroke-dasharray:7 6}.lead{stroke:#444;stroke-width:1.8;fill:none}.pt{fill:#555;stroke:#fff;stroke-width:2.5}</style>
