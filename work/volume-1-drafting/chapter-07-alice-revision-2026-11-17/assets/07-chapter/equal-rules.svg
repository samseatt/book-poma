<svg xmlns="http://www.w3.org/2000/svg" width="700" height="392" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Equal rules, unequal outcomes</title>
<desc id="desc">Two simulations of 10,000 traders who all start with 100 units and follow identical, fair rules. Left: when random pairs swap a fixed single unit on a coin flip, the money settles into an exponential spread, matching the dashed curve: most people end below the average of 100, about 63 percent, and the richest tenth hold about a third of all money. Right: when random pairs bet a tenth of the poorer trader's wealth on a fair coin, wealth keeps concentrating; the richest 1 percent's share climbs from 1 percent at the start to about 42 percent after 6,000 trades per person, with no sign of stopping. No one is more skilled than anyone else in either model. Original simulation.</desc>
<rect width="1000" height="560" fill="white"/>
