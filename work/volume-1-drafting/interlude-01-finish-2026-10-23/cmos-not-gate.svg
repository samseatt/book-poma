<svg xmlns="http://www.w3.org/2000/svg" width="600" height="355" viewBox="0 0 600 355" role="img" aria-labelledby="title desc">
<title id="title">A CMOS NOT gate in its two settled states</title>
<desc id="desc">Left: input zero turns the upper pMOS switch on and lower nMOS switch off; the output connects to the positive supply and becomes one. Right: input one reverses the switches; the output connects to ground and becomes zero. Each input controls both switches. This is a simplified switch model, not a physical layout.</desc>
