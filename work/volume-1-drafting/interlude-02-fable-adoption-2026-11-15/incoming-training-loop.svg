<svg xmlns="http://www.w3.org/2000/svg" width="700" height="399" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">The training loop</title>
<desc id="desc">Examples, each an input with a target, are split before learning into training, validation and test sets. Training examples feed a small neural network computing h equals sigma of W x plus b. Its prediction is compared with the target to give a loss, L equals minus the natural log of p. Backpropagation sends gradients back to the network, which updates its parameters: theta becomes theta minus eta times the gradient of L. Validation data is used to tune settings and decide when to stop; test data gives one final check on unseen examples. A strip at the bottom shows inference: a new input passes through the trained model, with its parameters fixed, to a prediction.</desc>
<rect width="1000" height="570" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717;text-anchor:middle}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:700}.label{font-size:20px}.small{font-size:17px;fill:#444}.box{fill:#fff;stroke:#555;stroke-width:1.8}.train{fill:#e4e4e4;stroke:#222;stroke-width:2.4}.edge{stroke:#bdbdbd;stroke-width:1.2}.node{fill:#fff;stroke:#222;stroke-width:2.2}.wire{stroke:#222;stroke-width:2.4;fill:none}.dash{stroke:#555;stroke-width:2;fill:none;stroke-dasharray:7 5}</style>
<defs><marker id="arr" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.6"/></marker></defs>
<text x="500" y="36" class="title">The training loop</text><rect x="30" y="80" width="190" height="66" rx="6" class="box"/><text x="125" y="108" class="label">examples</text><text x="125" y="132" class="small">(input, target)</text><path class="wire" d="M125 146 V172" marker-end="url(#arr)"/><rect x="30" y="182" width="190" height="56" rx="6" class="train"/><text x="125" y="217" class="label" style="font-weight:700">training</text><rect x="30" y="300" width="190" height="56" rx="6" class="box"/><text x="125" y="335" class="label">validation</text><rect x="30" y="418" width="190" height="56" rx="6" class="box"/><text x="125" y="453" class="label">test</text><text x="125" y="380" class="small">tune settings, decide</text><text x="125" y="399" class="small">when to stop</text><text x="125" y="498" class="small">one final check, unseen</text><path class="dash" d="M222 186 H246 V470 H222"/><text x="262" y="330" class="small" style="text-anchor:start" transform="rotate(90 262 330)">split before learning</text><line class="edge" x1="360" y1="170" x2="460" y2="150"/><line class="edge" x1="360" y1="170" x2="460" y2="203"/><line class="edge" x1="360" y1="170" x2="460" y2="256"/><line class="edge" x1="360" y1="170" x2="460" y2="309"/><line class="edge" x1="360" y1="235" x2="460" y2="150"/><line class="edge" x1="360" y1="235" x2="460" y2="203"/><line class="edge" x1="360" y1="235" x2="460" y2="256"/><line class="edge" x1="360" y1="235" x2="460" y2="309"/><line class="edge" x1="360" y1="300" x2="460" y2="150"/><line class="edge" x1="360" y1="300" x2="460" y2="203"/><line class="edge" x1="360" y1="300" x2="460" y2="256"/><line class="edge" x1="360" y1="300" x2="460" y2="309"/><line class="edge" x1="460" y1="150" x2="560" y2="200"/><line class="edge" x1="460" y1="150" x2="560" y2="262"/><line class="edge" x1="460" y1="203" x2="560" y2="200"/><line class="edge" x1="460" y1="203" x2="560" y2="262"/><line class="edge" x1="460" y1="256" x2="560" y2="200"/><line class="edge" x1="460" y1="256" x2="560" y2="262"/><line class="edge" x1="460" y1="309" x2="560" y2="200"/><line class="edge" x1="460" y1="309" x2="560" y2="262"/><circle class="node" cx="360" cy="170" r="13"/><circle class="node" cx="360" cy="235" r="13"/><circle class="node" cx="360" cy="300" r="13"/><circle class="node" cx="460" cy="150" r="13"/><circle class="node" cx="460" cy="203" r="13"/><circle class="node" cx="460" cy="256" r="13"/><circle class="node" cx="460" cy="309" r="13"/><circle class="node" cx="560" cy="200" r="13"/><circle class="node" cx="560" cy="262" r="13"/><path class="wire" d="M220 210 H330" marker-end="url(#arr)"/><text x="460" y="352" class="label">model: h = σ(Wx + b)</text><path class="wire" d="M576 231 H628" marker-end="url(#arr)"/><rect x="636" y="200" width="140" height="62" rx="6" class="box"/><text x="706" y="237" class="label">prediction</text><path class="wire" d="M776 231 H818" marker-end="url(#arr)"/><rect x="826" y="200" width="146" height="62" rx="6" class="box"/><text x="899" y="226" class="label">loss</text><text x="899" y="250" class="small">L = −ln p</text><text x="899" y="104" class="small">target, from the</text><text x="899" y="123" class="small">training example</text><path class="wire" d="M899 132 V190" marker-end="url(#arr)"/><path class="wire" d="M899 262 V410 H605 V290" marker-end="url(#arr)"/><text x="680" y="438" class="label">backpropagation: gradients ∇L</text><text x="680" y="463" class="label">update: θ ← θ − η∇L</text><rect x="300" y="500" width="672" height="54" rx="5" fill="#f2f2f2"/><text x="636" y="534" class="label">Inference: new input → trained model (parameters fixed) → prediction</text>
