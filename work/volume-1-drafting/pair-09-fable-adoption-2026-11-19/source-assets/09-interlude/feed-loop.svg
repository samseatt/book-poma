<svg xmlns="http://www.w3.org/2000/svg" width="700" height="392" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">The feed writes its own exam</title>
<desc id="desc">Left: a loop. The feed shows an item; the person clicks or skips; the click becomes training data; the model updates; the feed shows the next item. Two extra arrows: exploration, a slot set aside for guesses, enters the loop from outside; and habit, an arrow from the feed to the person, because people warm to what they are shown. Right: an original toy simulation of 400 runs of 5,000 recommendations, eight topics liked almost equally, a recommender that always shows its best guess, and a user who grows slightly fonder of a topic each time they click on it. The user's click probability on the topic the feed settles on rises from about 0.17 to about 0.57, while the average for the other topics stays near 0.16.</desc>
