<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">A world, its model, and the consequences of using it</title>
<desc id="desc">Measurements connect a physical counterpart to models. Tests compare the model with observations. Authorized experiments and actions return to the counterpart. Rendered experiences have real meaning and effects without proving model validity. Every path depends on physical infrastructure.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs>
<rect width="1000" height="700" fill="white"/>
<style>text {font-family: Arial, Helvetica, sans-serif; fill:#181818;} .heading{font-size:23px;font-weight:bold}.body{font-size:18px}.label{font-size:15px}.edge{fill:none;stroke:#333;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="500" y="43" text-anchor="middle" class="heading">Reality gets a route back into the design</text>
<text x="500" y="74" text-anchor="middle" class="body">Physical contact • credible models • consequential experience</text>
<rect x="30" y="150" width="275" height="135" rx="8" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="167.5" y="184" text-anchor="middle" class="heading">Physical counterpart</text>
<text x="167.5" y="215" text-anchor="middle" class="body">Bodies, devices, places</text>
<text x="167.5" y="240" text-anchor="middle" class="body">Instruments and observations</text>
<text x="167.5" y="265" text-anchor="middle" class="body">Conditions that can surprise us</text>
<rect x="365" y="150" width="270" height="135" rx="8" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="500.0" y="184" text-anchor="middle" class="heading">Model and simulation</text>
<text x="500.0" y="215" text-anchor="middle" class="body">Selected variables and rules</text>
<text x="500.0" y="240" text-anchor="middle" class="body">Explicit scope and assumptions</text>
<text x="500.0" y="265" text-anchor="middle" class="body">Predictions for a stated use</text>
<rect x="695" y="150" width="275" height="135" rx="8" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="832.5" y="184" text-anchor="middle" class="heading">Rendered experience</text>
<text x="832.5" y="215" text-anchor="middle" class="body">Rehearsal, encounter, art</text>
<text x="832.5" y="240" text-anchor="middle" class="body">Sources and liberties visible</text>
<text x="832.5" y="265" text-anchor="middle" class="body">Conviction is not validation</text>
<rect x="30" y="365" width="275" height="130" rx="8" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="167.5" y="399" text-anchor="middle" class="heading">Authorized action</text>
<text x="167.5" y="430" text-anchor="middle" class="body">Experiment or bounded trial</text>
<text x="167.5" y="455" text-anchor="middle" class="body">Purpose, permissions, resources</text>
<text x="167.5" y="480" text-anchor="middle" class="body">Consequences remain real</text>
<rect x="365" y="365" width="270" height="130" rx="8" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="500.0" y="399" text-anchor="middle" class="heading">Evidence of adequacy</text>
<text x="500.0" y="430" text-anchor="middle" class="body">Verification • validation</text>
<text x="500.0" y="455" text-anchor="middle" class="body">Compare with observations</text>
<text x="500.0" y="480" text-anchor="middle" class="body">Examine uncertainty and gaps</text>
<rect x="695" y="365" width="275" height="130" rx="8" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="832.5" y="399" text-anchor="middle" class="heading">People and meaning</text>
<text x="832.5" y="430" text-anchor="middle" class="body">Learning, attachment, choices</text>
<text x="832.5" y="455" text-anchor="middle" class="body">Real benefits or harms</text>
<text x="832.5" y="480" text-anchor="middle" class="body">A different claim to examine</text>
<path d="M305 195 H365" class="edge"/>
<path d="M635 195 H695" class="edge"/>
<path d="M500 285 V365" class="edge"/>
<path d="M365 425 H305" class="edge"/>
<path d="M167 365 V285" class="edge"/>
<path d="M832 285 V365" class="edge"/>
<text x="335" y="178" text-anchor="middle" class="label">measure</text>
<text x="665" y="178" text-anchor="middle" class="label">render</text>
<text x="516" y="330" text-anchor="start" class="label">test</text>
<text x="335" y="410" text-anchor="middle" class="label">inform</text>
<text x="181" y="330" text-anchor="start" class="label">act</text>
<text x="846" y="330" text-anchor="start" class="label">affect</text>
<rect x="30" y="555" width="940" height="100" rx="8" fill="#e4e4e4" stroke="#333" stroke-width="1.5"/>
<text x="500" y="587" text-anchor="middle" class="heading">Physical infrastructure supports every path</text>
<text x="500" y="617" text-anchor="middle" class="body">Energy • materials • computation • cooling • networks • maintenance</text>
<text x="500" y="644" text-anchor="middle" class="label">Changing a virtual law does not remove the physical dependencies of its implementation.</text>
</svg>