<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="840" viewBox="0 0 1100 840" role="img" aria-labelledby="title desc">
<title id="title">Integrity through the whole lifecycle</title>
<desc id="desc">Purpose, release evidence, operation and observed effects form the forward path. A credible hazard or challenge starts proportionate protection and independent investigation in parallel. Repair reaches affected cases, verification checks actual effects, and findings return to the purpose and rules. Unresolved consequences remain open.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:17px}.line{fill:none;stroke:#333;stroke-width:2.1;marker-end:url(#arrow)}.box{fill:#f5f5f5;stroke:#333;stroke-width:1.7}</style>
<rect width="1100" height="840" fill="white"/>
<text x="550" y="33" text-anchor="middle" class="head">INTEGRITY THROUGH THE WHOLE LIFECYCLE</text>
<text x="550" y="61" text-anchor="middle" class="body">The obligation continues after release, and after the first correction.</text>
<rect class="box" x="55" y="100" width="225" height="120" rx="5"/>
<text x="167.5" y="131" text-anchor="middle" class="head">PURPOSE</text>
<text x="167.5" y="159" text-anchor="middle" class="body">Values and standing</text>
<text x="167.5" y="183" text-anchor="middle" class="body">Limits and duties</text>
<rect class="box" x="310" y="100" width="225" height="120" rx="5"/>
<text x="422.5" y="131" text-anchor="middle" class="head">EVIDENCE</text>
<text x="422.5" y="159" text-anchor="middle" class="body">Claims and challenges</text>
<text x="422.5" y="183" text-anchor="middle" class="body">Tests and assumptions</text>
<rect class="box" x="565" y="100" width="225" height="120" rx="5"/>
<text x="677.5" y="131" text-anchor="middle" class="head">OPERATION</text>
<text x="677.5" y="159" text-anchor="middle" class="body">Authorized action</text>
<text x="677.5" y="183" text-anchor="middle" class="body">Bounded autonomy</text>
<rect class="box" x="820" y="100" width="225" height="120" rx="5"/>
<text x="932.5" y="131" text-anchor="middle" class="head">EFFECTS</text>
<text x="932.5" y="159" text-anchor="middle" class="body">What actually happened</text>
<text x="932.5" y="183" text-anchor="middle" class="body">Reports and feedback</text>
<path class="line" d="M280 160H310"/>
<path class="line" d="M535 160H565"/>
<path class="line" d="M790 160H820"/>
<path class="line" d="M932 220V250H550V280"/>
<rect class="box" x="370" y="280" width="360" height="78" rx="5"/>
<text x="550.0" y="311" text-anchor="middle" class="head">HAZARD OR CHALLENGE</text>
<text x="550.0" y="339" text-anchor="middle" class="body">Assess urgency and credibility</text>
<path class="line" d="M550 358V383H280V410"/>
<path class="line" d="M550 383H820V410"/>
<rect class="box" x="100" y="410" width="360" height="98" rx="5"/>
<text x="280.0" y="441" text-anchor="middle" class="head">PROTECT AND SUSTAIN</text>
<text x="280.0" y="469" text-anchor="middle" class="body">Proportionate interim action</text>
<text x="280.0" y="493" text-anchor="middle" class="body">Funded essential continuity</text>
<rect class="box" x="640" y="410" width="360" height="98" rx="5"/>
<text x="820.0" y="441" text-anchor="middle" class="head">INVESTIGATE AND ANSWER</text>
<text x="820.0" y="469" text-anchor="middle" class="body">Evidence, causes, duties</text>
<text x="820.0" y="493" text-anchor="middle" class="body">Independent review and recourse</text>
<path class="line" d="M280 508V535H550V565"/>
<path class="line" d="M820 508V535H550"/>
<rect class="box" x="300" y="565" width="500" height="98" rx="5"/>
<text x="550.0" y="596" text-anchor="middle" class="head">REPAIR THE AFFECTED PATTERN</text>
<text x="550.0" y="624" text-anchor="middle" class="body">Correct dependent cases, including silent ones</text>
<text x="550.0" y="648" text-anchor="middle" class="body">Change recurring causes; track lasting losses</text>
<path class="line" d="M550 663V703"/>
<rect class="box" x="300" y="703" width="500" height="98" rx="5"/>
<text x="550.0" y="734" text-anchor="middle" class="head">VERIFY THE CONSEQUENCES</text>
<text x="550.0" y="762" text-anchor="middle" class="body">Confirm actual effects and remaining burdens</text>
<text x="550.0" y="786" text-anchor="middle" class="body">Let contrary evidence change the design</text>
<path class="line" d="M300 752H30V160H55"/>
<text x="65" y="625" class="body">Revise purposes,</text><text x="65" y="650" class="body">rules and conditions</text>
<path class="line" d="M800 752H842" stroke-dasharray="6 5"/>
<text x="860" y="739" class="small">Unresolved effects</text><text x="860" y="765" class="small">remain open</text>
<text x="550" y="827" text-anchor="middle" class="small">Protection can begin before investigation concludes.</text>
</svg>
