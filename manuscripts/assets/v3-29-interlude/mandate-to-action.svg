<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200" role="img" aria-labelledby="title desc"><title id="title">From mandate to civic action</title><desc id="desc">Two institutions retain their mandates and local models. Translation exposes mismatches. A bounded decision executes valid requests, or routes unresolved authority to review and authorized continuity. Effects return as evidence; review must use the appropriate amendment process.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/></marker></defs><rect width="1000" height="1200" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#161616}.head{font-weight:700;font-size:23px}.body{font-size:20px}.small{font-size:18px}.arrow{stroke:#444;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<text x="500" y="43" class="head" text-anchor="middle">FROM MANDATE TO CIVIC ACTION</text>
<text x="500" y="76" class="small" text-anchor="middle">An illustrative shared service; participants retain distinct powers.</text>
<rect x="55" y="110" width="420" height="125" rx="9" fill="#f3f3f3" stroke="#333" stroke-width="1.7"/>
<text x="265.0" y="143" class="head" text-anchor="middle">Institution A</text>
<text x="265.0" y="175" class="body" text-anchor="middle">Recognized authority and scope</text>
<text x="265.0" y="202" class="body" text-anchor="middle">Local policy and effective version</text>
<rect x="525" y="110" width="420" height="125" rx="9" fill="#f3f3f3" stroke="#333" stroke-width="1.7"/>
<text x="735.0" y="143" class="head" text-anchor="middle">Institution B</text>
<text x="735.0" y="175" class="body" text-anchor="middle">Recognized authority and scope</text>
<text x="735.0" y="202" class="body" text-anchor="middle">Local policy and effective version</text>
<path d="M265 235 V267 H420 V300" class="arrow"/>
<path d="M735 235 V267 H580 V300" class="arrow"/>
<rect x="170" y="300" width="660" height="140" rx="9" fill="#f3f3f3" stroke="#333" stroke-width="1.7"/>
<text x="500.0" y="333" class="head" text-anchor="middle">Explicit translation</text>
<text x="500.0" y="365" class="body" text-anchor="middle">Claims, permissions and local meanings</text>
<text x="500.0" y="392" class="body" text-anchor="middle">Mapping version • assumptions • unresolved differences</text>
<text x="500.0" y="419" class="body" text-anchor="middle">A mapping cannot create jurisdiction.</text>
<path d="M500 440 V488" class="arrow"/>
<rect x="170" y="488" width="660" height="140" rx="9" fill="#f3f3f3" stroke="#333" stroke-width="1.7"/>
<text x="500.0" y="521" class="head" text-anchor="middle">Bounded decision</text>
<text x="500.0" y="553" class="body" text-anchor="middle">Is this action authorized here and now?</text>
<text x="500.0" y="580" class="body" text-anchor="middle">Applicable rules + current evidence + permitted scope</text>
<text x="500.0" y="607" class="body" text-anchor="middle">Operator executes; it does not invent the mandate.</text>
<path d="M330 628 V700" class="arrow"/>
<text x="255" y="669" class="small" text-anchor="middle">Valid request</text>
<path d="M670 628 V700" class="arrow"/>
<text x="753" y="669" class="small" text-anchor="middle">Unresolved authority</text>
<rect x="55" y="700" width="420" height="146" rx="9" fill="#e8e8e8" stroke="#333" stroke-width="1.7"/>
<text x="265.0" y="733" class="head" text-anchor="middle">Execution</text>
<text x="265.0" y="765" class="body" text-anchor="middle">Perform the permitted action</text>
<text x="265.0" y="792" class="body" text-anchor="middle">Recognize retries and partial effects</text>
<text x="265.0" y="819" class="body" text-anchor="middle">Record what actually happened.</text>
<rect x="525" y="700" width="420" height="146" rx="9" fill="#fff" stroke="#333" stroke-width="1.7"/>
<text x="735.0" y="733" class="head" text-anchor="middle">Review + continuity</text>
<text x="735.0" y="765" class="body" text-anchor="middle">Route to the competent body</text>
<text x="735.0" y="792" class="body" text-anchor="middle">Use an authorized fallback</text>
<text x="735.0" y="819" class="body" text-anchor="middle">No new power from an outage.</text>
<path d="M265 846 V890 H420 V930" class="arrow"/>
<path d="M735 846 V890 H580 V930" class="arrow"/>
<rect x="170" y="930" width="660" height="124" rx="9" fill="#f3f3f3" stroke="#333" stroke-width="1.7"/>
<text x="500.0" y="963" class="head" text-anchor="middle">Evidence and correction</text>
<text x="500.0" y="995" class="body" text-anchor="middle">Decision, mandate version, effects and uncertainty</text>
<text x="500.0" y="1022" class="body" text-anchor="middle">Challenge, correction or authorized amendment</text>
<path d="M830 992 H970 V95 H265 V110" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M735 95 V110" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="500" y="1100" class="small" text-anchor="middle">Return through the appropriate review or amendment procedure.</text>
<text x="500" y="1130" class="small" text-anchor="middle">Technical agreement is not political consent.</text>
<text x="500" y="1160" class="small" text-anchor="middle">A person can contest the record without accepting its model of her.</text>
</svg>
