<svg xmlns="http://www.w3.org/2000/svg" width="900" height="790" viewBox="0 0 900 790" role="img" aria-labelledby="title desc">
<title id="title">A commons service within its boundaries</title><desc id="desc">The wider ecosystem and accountable stewards set constraints. A useful service request is checked for authority and available resources. Protected records remain with custodians, local execution passes through an output check, and a useful service reaches people. Protected receipts and observed consequences inform stewardship and revised limits.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#444"/></marker></defs>
<rect width="900" height="790" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.heading{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:14px;fill:#444}.edge{fill:none;stroke:#444;stroke-width:2;marker-end:url(#arrow)}.feedback{fill:none;stroke:#666;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arrow)}</style>
<rect x="40" y="20" width="820" height="82" rx="7" fill="#e8e8e8" stroke="#444" stroke-width="1.5"/>
<text x="450.0" y="48" text-anchor="middle" class="heading">LIVING SYSTEMS AND ACCOUNTABLE STEWARDSHIP</text>
<text x="450.0" y="74" text-anchor="middle" class="body">Ecological conditions, rights, recovery time and legitimate priorities</text>
<rect x="40" y="155" width="240" height="100" rx="7" fill="#f7f7f7" stroke="#444" stroke-width="1.5"/>
<text x="160.0" y="183" text-anchor="middle" class="heading">SERVICE REQUEST</text>
<text x="160.0" y="209" text-anchor="middle" class="body">A purpose and outcome</text>
<text x="160.0" y="232" text-anchor="middle" class="body">that actually help</text>
<rect x="330" y="155" width="240" height="100" rx="7" fill="#f7f7f7" stroke="#444" stroke-width="1.5"/>
<text x="450.0" y="183" text-anchor="middle" class="heading">AUTHORITY CHECK</text>
<text x="450.0" y="209" text-anchor="middle" class="body">Who may do what,</text>
<text x="450.0" y="232" text-anchor="middle" class="body">under which conditions?</text>
<rect x="620" y="155" width="240" height="100" rx="7" fill="#f7f7f7" stroke="#444" stroke-width="1.5"/>
<text x="740.0" y="183" text-anchor="middle" class="heading">RESOURCE CHECK</text>
<text x="740.0" y="209" text-anchor="middle" class="body">Reserve capacity within</text>
<text x="740.0" y="232" text-anchor="middle" class="body">physical and civic limits</text>
<path d="M280 205 H330" class="edge"/>
<path d="M570 205 H620" class="edge"/>
<path d="M740 102 V155" class="feedback"/>
<path d="M450 102 V155" class="feedback"/>
<rect x="40" y="345" width="240" height="130" rx="7" fill="#eeeeee" stroke="#444" stroke-width="1.5"/>
<text x="160.0" y="373" text-anchor="middle" class="heading">PROTECTED SOURCES</text>
<text x="160.0" y="399" text-anchor="middle" class="body">Records stay with</text>
<text x="160.0" y="422" text-anchor="middle" class="body">their custodians.</text>
<text x="160.0" y="445" text-anchor="middle" class="body">Some are never collected.</text>
<rect x="330" y="345" width="240" height="130" rx="7" fill="#f7f7f7" stroke="#444" stroke-width="1.5"/>
<text x="450.0" y="373" text-anchor="middle" class="heading">LOCAL EXECUTION</text>
<text x="450.0" y="399" text-anchor="middle" class="body">Perform authorized work;</text>
<text x="450.0" y="422" text-anchor="middle" class="body">meter its use;</text>
<text x="450.0" y="445" text-anchor="middle" class="body">stop or adapt at limits.</text>
<rect x="620" y="345" width="240" height="130" rx="7" fill="#f7f7f7" stroke="#444" stroke-width="1.5"/>
<text x="740.0" y="373" text-anchor="middle" class="heading">OUTPUT CHECK</text>
<text x="740.0" y="399" text-anchor="middle" class="body">Release only the approved</text>
<text x="740.0" y="422" text-anchor="middle" class="body">result; inspect cumulative</text>
<text x="740.0" y="445" text-anchor="middle" class="body">disclosure as well.</text>
<path d="M740 255 V298 H450 V345" class="edge"/>
<text x="600" y="286" text-anchor="middle" class="label">admit, adapt, defer or refuse</text>
<path d="M280 410 H330" class="edge"/>
<path d="M570 410 H620" class="edge"/>
<rect x="330" y="555" width="240" height="96" rx="7" fill="#f7f7f7" stroke="#444" stroke-width="1.5"/>
<text x="450.0" y="583" text-anchor="middle" class="heading">PROTECTED RECEIPT</text>
<text x="450.0" y="609" text-anchor="middle" class="body">Actual use, policy version,</text>
<text x="450.0" y="632" text-anchor="middle" class="body">consequences and limits</text>
<rect x="620" y="555" width="240" height="96" rx="7" fill="#f7f7f7" stroke="#444" stroke-width="1.5"/>
<text x="740.0" y="583" text-anchor="middle" class="heading">USEFUL SERVICE</text>
<text x="740.0" y="609" text-anchor="middle" class="body">A warning, a provision</text>
<text x="740.0" y="632" text-anchor="middle" class="body">or authorized assistance</text>
<path d="M450 475 V555" class="edge"/>
<path d="M740 475 V555" class="edge"/>
<rect x="40" y="695" width="820" height="75" rx="7" fill="#e8e8e8" stroke="#444" stroke-width="1.5"/>
<text x="450.0" y="723" text-anchor="middle" class="heading">OBSERVE THE RESULT AND REVISE THE ARRANGEMENT</text>
<text x="450.0" y="749" text-anchor="middle" class="body">Check delivery, ecosystem effects, recovery and burdens displaced elsewhere.</text>
<path d="M450 651 V695" class="edge"/>
<path d="M740 651 V695" class="edge"/>
<path d="M40 732 H18 V60 H40" class="feedback"/>
<text x="153" y="566" text-anchor="middle" class="label">Feedback changes future use</text>
</svg>