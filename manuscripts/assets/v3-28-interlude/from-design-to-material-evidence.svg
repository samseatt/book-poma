<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1110" viewBox="0 0 960 1110" role="img" aria-labelledby="title desc">
<title id="title">From design to material evidence</title><desc id="desc">One functional requirement branches into two qualified production routes: local polymer fabrication and regional metal machining. Each has its own material, recipe and inspection evidence. Physical acceptance leads to use, repair and return; lifecycle evidence informs future design. A record is not the object.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="960" height="1110" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#161616} .title{font-size:30px;font-weight:700} .head{font-size:24px;font-weight:700} .body{font-size:22px} .small{font-size:20px} .arrow{fill:none;stroke:#333;stroke-width:2.4;marker-end:url(#arrow)}</style>

<text x="500" y="44" text-anchor="middle" class="title">Same function. Different routes.</text>
<text x="500" y="78" text-anchor="middle" class="body">The actual part still has to earn release.</text>
<rect x="210" y="112" width="570" height="106" rx="7" fill="#f6f6f6" stroke="#333" stroke-width="1.8"/>
<text x="495.0" y="148" text-anchor="middle" class="head">Need and requirements</text>
<text x="495.0" y="184" text-anchor="middle" class="body">A serviceable cover for an existing unit</text>
<path d="M495 218 V252" class="arrow"/>
<rect x="160" y="264" width="670" height="138" rx="7" fill="#f6f6f6" stroke="#333" stroke-width="1.8"/>
<text x="495.0" y="300" text-anchor="middle" class="head">Design definition</text>
<text x="495.0" y="336" text-anchor="middle" class="body">Use, interfaces, permitted variation</text>
<text x="495.0" y="366" text-anchor="middle" class="body">Evidence required • lifecycle constraints</text>
<path d="M325 402 V442 H290 V469" class="arrow"/>
<path d="M665 402 V442 H700 V469" class="arrow"/>
<rect x="110" y="482" width="360" height="174" rx="7" fill="#f6f6f6" stroke="#333" stroke-width="1.8"/>
<text x="290.0" y="518" text-anchor="middle" class="head">Route A: local fabrication</text>
<text x="290.0" y="554" text-anchor="middle" class="body">Polymer material lot</text>
<text x="290.0" y="584" text-anchor="middle" class="body">Qualified additive recipe</text>
<text x="290.0" y="614" text-anchor="middle" class="body">Process-specific checks</text>
<rect x="520" y="482" width="360" height="174" rx="7" fill="#f6f6f6" stroke="#333" stroke-width="1.8"/>
<text x="700.0" y="518" text-anchor="middle" class="head">Route B: regional machining</text>
<text x="700.0" y="554" text-anchor="middle" class="body">Metal material lot</text>
<text x="700.0" y="584" text-anchor="middle" class="body">Qualified machining route</text>
<text x="700.0" y="614" text-anchor="middle" class="body">Process-specific checks</text>
<text x="495" y="693" text-anchor="middle" class="small">Alternative ways to meet the requirement</text>
<path d="M290 656 V711 H380 V739" class="arrow"/>
<path d="M700 656 V711 H610 V739" class="arrow"/>
<rect x="160" y="752" width="670" height="145" rx="7" fill="#e9e9e9" stroke="#333" stroke-width="1.8"/>
<text x="495.0" y="788" text-anchor="middle" class="head">Physical inspection and disposition</text>
<text x="495.0" y="824" text-anchor="middle" class="body">Measured result + configuration + authority</text>
<text x="495.0" y="854" text-anchor="middle" class="body">Release, rework or hold for investigation</text>
<path d="M495 897 V933" class="arrow"/>
<text x="565" y="925" text-anchor="middle" class="small">Released</text>
<rect x="210" y="946" width="570" height="112" rx="7" fill="#f6f6f6" stroke="#333" stroke-width="1.8"/>
<text x="495.0" y="982" text-anchor="middle" class="head">Use → repair → return</text>
<text x="495.0" y="1018" text-anchor="middle" class="body">Instance history • recovery actually achieved</text>
<path d="M210 1000 H55 V331 H148" class="arrow" stroke-dasharray="8 7"/>
<text x="38" y="720" transform="rotate(-90 38 720)" text-anchor="middle" class="small">Lifecycle evidence informs the next design</text>
<text x="500" y="1090" text-anchor="middle" class="small">Illustrative architecture; neither route inherits the other’s qualification.</text>
</svg>
