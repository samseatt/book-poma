<text x="490" y="165" text-anchor="middle" font-size="23" font-weight="bold" fill="#111">Faithful output: σQ ≈ 2 exp(−μL)</text>
<text x="730" y="252.0" text-anchor="middle" font-size="20" font-weight="normal" fill="#111">background rate = 1</text>
<text x="435" y="220.0" text-anchor="middle" font-size="20" font-weight="normal" fill="#111">μL = ln 2 ≈ 0.69</text>
<line x1="357" y1="235.0" x2="309.83924814931873" y2="258.0" stroke="#222" stroke-width="1"/>
<text x="213" y="370" text-anchor="middle" font-size="18" font-weight="normal" fill="#111">advantage</text>
<text x="213" y="393" text-anchor="middle" font-size="18" font-weight="normal" fill="#111">maintained</text>
<text x="710" y="302" text-anchor="middle" font-size="18" font-weight="normal" fill="#111">faithful output loses</text>
<text x="710" y="325" text-anchor="middle" font-size="18" font-weight="normal" fill="#111">its advantage</text>
<text x="520" y="481" text-anchor="middle" font-size="23" font-weight="normal" fill="#111">Expected copying errors per sequence, μL</text>
<text x="36" y="268" font-size="21" text-anchor="middle" transform="rotate(-90 36 268)">Relative rate of faithful copies, σQ</text>
<line x1="40" y1="504" x2="960" y2="504" stroke="#222" stroke-width="1"/>
<text x="500" y="536" text-anchor="middle" font-size="21" font-weight="normal" fill="#111">Q = (1 − μ)ᴸ ≈ exp(−μL)     •     Longer sequences need greater copying fidelity.</text>
<text x="500" y="567" text-anchor="middle" font-size="17" font-weight="normal" fill="#111">Independent errors; negligible back mutation. A model threshold, not a universal genome limit.</text>
</svg>
