<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">When copying consumes an advantage</title><desc id="desc">Illustrative favored-sequence model. A sequence with relative reproductive rate sigma equal to 2 produces faithful copies at relative rate 2 exp(-mu L). It crosses the background rate of one at expected errors mu L equal to ln 2. The model assumes independent errors, small per-letter error rate and negligible back mutation, not a universal genome size limit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#222"/></marker></defs>
<rect width="1000" height="580" fill="white"/>
<text x="500" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111">WHEN COPYING CONSUMES AN ADVANTAGE</text>
<text x="500" y="68" text-anchor="middle" font-size="20" font-weight="normal" fill="#111">Illustration: a favored sequence reproduces twice as fast (σ = 2).</text>
