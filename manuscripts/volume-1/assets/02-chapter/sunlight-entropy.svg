<title id="title">Energy passes through; entropy increases</title><desc id="desc">At approximate thermal balance, the same energy arrives in fewer high-energy sunlight photons and leaves in more low-energy infrared photons. Sun temperature about 5800 kelvin, Earth effective emitting temperature about 255 kelvin. About twenty photons leave per absorbed photon in the thermal estimate. Reflected sunlight is excluded; the drawing is not to scale.</desc>
