<svg xmlns="http://www.w3.org/2000/svg" width="700" height="434" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Three networks around an AI cluster</title>
<desc id="desc">A user device connects through the internet, over TCP/IP or QUIC, to a front-end Ethernet network that also reaches storage. Below it, two racks; in each, GPUs are joined by NVLink switches into a scale-up domain at about 1.8 terabytes per second per GPU, bidirectional. Under the racks, a scale-out fat tree of leaf and spine switches, InfiniBand or RoCE, gives every GPU its own 400 to 800 gigabit port. Notes contrast classic loss-based TCP with the RDMA fabric, where credits or pauses prevent buffer overflow. All GPUs attach to switches; none is a transit node for the next GPU.</desc>
<rect width="1000" height="620" fill="white"/>
