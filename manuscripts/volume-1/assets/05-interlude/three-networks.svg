<text class="small" x="610" y="603">one 400–800 Gb/s port per GPU (wiring simplified)</text>
<text class="small" x="40" y="158" style="text-anchor:start;font-weight:700;fill:#171717">classic TCP:</text>
<text class="small" x="40" y="179" style="text-anchor:start">infers congestion</text>
<text class="small" x="40" y="200" style="text-anchor:start">from loss, backs off</text>
<text class="small" x="40" y="285" style="text-anchor:start;font-weight:700;fill:#171717">~1.8 TB/s per GPU</text>
<text class="small" x="40" y="306" style="text-anchor:start">both directions combined</text>
<text class="small" x="40" y="327" style="text-anchor:start">dozens act almost as one</text>
<text class="small" x="40" y="470" style="text-anchor:start;font-weight:700;fill:#171717">asks permission:</text>
<text class="small" x="40" y="491" style="text-anchor:start">credits (InfiniBand)</text>
<text class="small" x="40" y="512" style="text-anchor:start">or pauses + ECN (RoCE)</text>
