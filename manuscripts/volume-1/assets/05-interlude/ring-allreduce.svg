<svg xmlns="http://www.w3.org/2000/svg" width="700" height="392" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Ring all-reduce</title>
<desc id="desc">Four GPUs in a ring, each sending to the next. Three grids show the state of four chunks of gradients, a to d, on each GPU. At the start each GPU holds only its own gradients. After the reduce-scatter phase, three steps, each GPU holds the complete sum of one chunk: GPU 0 holds the sum of b, GPU 1 of c, GPU 2 of d and GPU 3 of a. After the all-gather phase, three more steps, every GPU holds all four sums. Each GPU sends 2(N minus 1) over N times S bytes, 1.5S for four GPUs and approaching 2S as the ring grows.</desc>
<rect width="1000" height="560" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717;text-anchor:middle}.title{font-size:28px;font-weight:700}.head{font-size:20px;font-weight:700}.label{font-size:18px}.small{font-size:16px;fill:#444}.cell{font-size:15px}.wire{stroke:#222;stroke-width:2.4;fill:none}.thin{stroke:#555;stroke-width:1.5;fill:none}.box{fill:#fff;stroke:#222;stroke-width:2.2}.shade{fill:#e6e6e6;stroke:#555;stroke-width:1.6}.dark{fill:#9b9b9b;stroke:#444;stroke-width:1.4}.pale{fill:#f7f7f7;stroke:#bbb;stroke-width:1.2}</style>
<defs><marker id="arr" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.6"/></marker></defs>
