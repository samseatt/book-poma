<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="740" viewBox="0 0 1040 740" role="img" aria-labelledby="title desc">
<title id="title">Bonds, bridges and authority</title>
<desc id="desc">The same six people appear in three panels. Solid lines join people within two groups. Dashed lines add cross-group ties in the second panel. The third adds a separate institution with directed authority links. These are different relations, not measurements of consciousness.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#222"/></marker></defs>
<rect width="1040" height="740" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717}.title{font-size:31px;font-weight:700}.head{font-size:27px;font-weight:700}.body{font-size:24px}.small{font-size:22px}.node{font-size:20px;font-weight:700}</style>
<text x="36" y="47" class="title" text-anchor="start">Bonds, bridges and authority</text>
<text x="36" y="83" class="body" text-anchor="start">The same people; different kinds of relationship.</text>
<rect x="28" y="112" width="324" height="476" rx="8" fill="#fafafa" stroke="#b5b5b5" stroke-width="1.5"/>
<text x="190" y="153" class="head" text-anchor="middle">BONDS</text>
<text x="190" y="187" class="small" text-anchor="middle">Who trusts whom?</text>
<line x1="98" y1="295" x2="161" y2="370" stroke="#444" stroke-width="2.5"/>
<line x1="161" y1="370" x2="98" y2="445" stroke="#444" stroke-width="2.5"/>
<line x1="98" y1="445" x2="98" y2="295" stroke="#444" stroke-width="2.5"/>
<line x1="282" y1="295" x2="219" y2="370" stroke="#444" stroke-width="2.5"/>
<line x1="219" y1="370" x2="282" y2="445" stroke="#444" stroke-width="2.5"/>
<line x1="282" y1="445" x2="282" y2="295" stroke="#444" stroke-width="2.5"/>
<circle cx="98" cy="295" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="98" y="302" class="node" text-anchor="middle">A</text>
<circle cx="161" cy="370" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="161" y="377" class="node" text-anchor="middle">B</text>
<circle cx="98" cy="445" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="98" y="452" class="node" text-anchor="middle">C</text>
<circle cx="282" cy="295" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="282" y="302" class="node" text-anchor="middle">D</text>
<circle cx="219" cy="370" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="219" y="377" class="node" text-anchor="middle">E</text>
<circle cx="282" cy="445" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="282" y="452" class="node" text-anchor="middle">F</text>
<text x="190" y="500" class="small" text-anchor="middle">Familiarity, reciprocity,</text>
<text x="190" y="532" class="small" text-anchor="middle">support within groups.</text>
<text x="190" y="564" class="small" text-anchor="middle">Insiders can exclude.</text>
<rect x="368" y="112" width="324" height="476" rx="8" fill="#fafafa" stroke="#b5b5b5" stroke-width="1.5"/>
<text x="530" y="153" class="head" text-anchor="middle">BRIDGES</text>
<text x="530" y="187" class="small" text-anchor="middle">Who reaches whom?</text>
<line x1="438" y1="295" x2="501" y2="370" stroke="#444" stroke-width="2.5"/>
<line x1="501" y1="370" x2="438" y2="445" stroke="#444" stroke-width="2.5"/>
<line x1="438" y1="445" x2="438" y2="295" stroke="#444" stroke-width="2.5"/>
<line x1="622" y1="295" x2="559" y2="370" stroke="#444" stroke-width="2.5"/>
<line x1="559" y1="370" x2="622" y2="445" stroke="#444" stroke-width="2.5"/>
<line x1="622" y1="445" x2="622" y2="295" stroke="#444" stroke-width="2.5"/>
<line x1="438" y1="295" x2="622" y2="295" stroke="#111" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="501" y1="370" x2="559" y2="370" stroke="#111" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="438" y1="445" x2="622" y2="445" stroke="#111" stroke-width="3" stroke-dasharray="8 6"/>
<circle cx="438" cy="295" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="438" y="302" class="node" text-anchor="middle">A</text>
<circle cx="501" cy="370" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="501" y="377" class="node" text-anchor="middle">B</text>
<circle cx="438" cy="445" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="438" y="452" class="node" text-anchor="middle">C</text>
<circle cx="622" cy="295" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="622" y="302" class="node" text-anchor="middle">D</text>
<circle cx="559" cy="370" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="559" y="377" class="node" text-anchor="middle">E</text>
<circle cx="622" cy="445" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="622" y="452" class="node" text-anchor="middle">F</text>
<text x="530" y="500" class="small" text-anchor="middle">Access across groups;</text>
<text x="530" y="532" class="small" text-anchor="middle">new information or help.</text>
<text x="530" y="564" class="small" text-anchor="middle">A tie can remain unused.</text>
<rect x="708" y="112" width="324" height="476" rx="8" fill="#fafafa" stroke="#b5b5b5" stroke-width="1.5"/>
<text x="870" y="153" class="head" text-anchor="middle">AUTHORITY</text>
<text x="870" y="187" class="small" text-anchor="middle">Who can decide?</text>
<line x1="778" y1="295" x2="841" y2="370" stroke="#bbb" stroke-width="2.5"/>
<line x1="841" y1="370" x2="778" y2="445" stroke="#bbb" stroke-width="2.5"/>
<line x1="778" y1="445" x2="778" y2="295" stroke="#bbb" stroke-width="2.5"/>
<line x1="962" y1="295" x2="899" y2="370" stroke="#bbb" stroke-width="2.5"/>
<line x1="899" y1="370" x2="962" y2="445" stroke="#bbb" stroke-width="2.5"/>
<line x1="962" y1="445" x2="962" y2="295" stroke="#bbb" stroke-width="2.5"/>
<rect x="797" y="213" width="146" height="42" rx="3" fill="#e4e4e4" stroke="#222" stroke-width="2"/>
<text x="870" y="242" class="small" text-anchor="middle">Institution</text>
<line x1="813" y1="255" x2="786" y2="275" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="927" y1="255" x2="954" y2="275" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="778" cy="295" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="778" y="302" class="node" text-anchor="middle">A</text>
<circle cx="841" cy="370" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="841" y="377" class="node" text-anchor="middle">B</text>
<circle cx="778" cy="445" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="778" y="452" class="node" text-anchor="middle">C</text>
<circle cx="962" cy="295" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="962" y="302" class="node" text-anchor="middle">D</text>
<circle cx="899" cy="370" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="899" y="377" class="node" text-anchor="middle">E</text>
<circle cx="962" cy="445" r="18" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="962" y="452" class="node" text-anchor="middle">F</text>
<text x="870" y="500" class="small" text-anchor="middle">Rules, allocation,</text>
<text x="870" y="532" class="small" text-anchor="middle">permission and sanctions.</text>
<text x="870" y="564" class="small" text-anchor="middle">Power can lack legitimacy.</text>
<line x1="37" y1="626" x2="87" y2="626" stroke="#333" stroke-width="3"/>
<text x="100" y="634" class="small" text-anchor="start">Within-group tie</text>
<line x1="365" y1="626" x2="415" y2="626" stroke="#333" stroke-width="3" stroke-dasharray="8 6"/>
<text x="428" y="634" class="small" text-anchor="start">Cross-group tie</text>
<line x1="706" y1="626" x2="756" y2="626" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
<text x="770" y="634" class="small" text-anchor="start">Authority link</text>
<text x="36" y="684" class="small" text-anchor="start">Layers can overlap. A denser graph does not tell us what its connections do.</text>
<text x="36" y="719" class="small" text-anchor="start">Conceptual schematic • no measured network or causal score is implied</text>
</svg>
