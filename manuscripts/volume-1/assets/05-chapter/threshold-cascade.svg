<svg xmlns="http://www.w3.org/2000/svg" width="700" height="371" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Two crowds, one stone</title>
<desc id="desc">Two panels with the fraction already acting on the horizontal axis and the fraction willing to act on the vertical, with the diagonal drawn. Left: an S-shaped curve crosses the diagonal three times, at a stable calm state near the bottom, an unstable tipping point in the middle and a stable riot state near the top; a staircase starting from a small outbreak steps down to calm. Right: a slightly shifted curve stays above the diagonal until near the top, so the same small start climbs step by step to the riot state; the calm state no longer exists.</desc>
<rect width="1000" height="530" fill="white"/>
