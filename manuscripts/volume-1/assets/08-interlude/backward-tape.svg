<svg xmlns="http://www.w3.org/2000/svg" width="700" height="392" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">The tape that runs backward</title>
<desc id="desc">The computation y equals w times x plus b, followed by the squared error against a target, drawn as a chain of operations. Forward, solid arrows carry values: w is 0.5 and x is 2, their product is 1, adding b of 0 gives y of 1, subtracting the target of 3 gives minus 2, and squaring gives a loss of 4. Backward, dashed arrows carry gradients: 1 at the loss, minus 4 after the square, minus 4 through the subtraction and the addition, minus 4 to b, and minus 8 to w, because the multiplication passes back the incoming gradient times x. Each operation multiplies the gradient arriving from above by its own local slope: the chain rule.</desc>
<rect width="1000" height="560" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717;text-anchor:middle}.title{font-size:28px;font-weight:700}.op{font-size:26px;font-weight:700}.lab{font-size:19px}.val{font-size:18px}.grad{font-size:18px;font-weight:700}.small{font-size:16px;fill:#444}.fw{stroke:#222;stroke-width:2.4;fill:none}.bw{stroke:#666;stroke-width:2.2;fill:none;stroke-dasharray:7 5}.node{fill:#fff;stroke:#222;stroke-width:2.4}.inp{fill:#ececec;stroke:#222;stroke-width:2}.data{fill:#fff;stroke:#888;stroke-width:1.8;stroke-dasharray:4 4}</style>
<defs><marker id="af" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#666"/></marker></defs>
<text class="title" x="500" y="42">The tape that runs backward</text>
<text class="small" x="500" y="70">forward: values (solid) · backward: gradients of the loss (dashed)</text>
<rect class="inp" x="35.0" y="106" width="150" height="48" rx="8"/><text class="lab" x="110" y="137">w = 0.5</text>
<rect class="data" x="35.0" y="346" width="150" height="48" rx="8"/><text class="lab" x="110" y="377">x = 2</text>
<rect class="inp" x="405.0" y="406" width="150" height="48" rx="8"/><text class="lab" x="480" y="437">b = 0</text>
<rect class="data" x="575.0" y="406" width="170" height="48" rx="8"/><text class="lab" x="660" y="437">target = 3</text>
<path class="fw" d="M185,145 L269.8,219.1" marker-end="url(#af)"/>
<text class="val" x="221.0" y="170.6">0.5</text>
<path class="bw" d="M265.9,240.3 L174.8,154" marker-end="url(#ab)"/>
<text class="grad" x="187.9" y="223.1">−8</text>
<path class="fw" d="M168.1,346 L269,273" marker-end="url(#af)"/>
<text class="val" x="189.0" y="290.6">2</text>
<path class="fw" d="M334.0,240.0 L438.0,240.0" marker-end="url(#af)"/>
<text class="val" x="390.0" y="226.0">1</text>
<path class="bw" d="M446.0,260.0 L342.0,260.0" marker-end="url(#ab)"/>
<text class="grad" x="390.0" y="288.0">−4</text>
<path class="fw" d="M470.0,406.0 L470.0,292.0" marker-end="url(#af)"/>
<path class="bw" d="M490.0,284.0 L490.0,398.0" marker-end="url(#ab)"/>
<text class="grad" x="512.0" y="346.0">−4</text>
<path class="fw" d="M514.0,240.0 L618.0,240.0" marker-end="url(#af)"/>
<text class="val" x="570.0" y="226.0">y = 1</text>
<path class="bw" d="M626.0,260.0 L522.0,260.0" marker-end="url(#ab)"/>
<text class="grad" x="570.0" y="288.0">−4</text>
<path class="fw" d="M650.0,406.0 L650.0,292.0" marker-end="url(#af)"/>
<path class="fw" d="M694.0,240.0 L788.0,240.0" marker-end="url(#af)"/>
<text class="val" x="745.0" y="226.0">−2</text>
<path class="bw" d="M796.0,260.0 L702.0,260.0" marker-end="url(#ab)"/>
<text class="grad" x="745.0" y="288.0">−4</text>
<circle class="node" cx="300" cy="250" r="34"/><text class="op" x="300" y="259">×</text>
<circle class="node" cx="480" cy="250" r="34"/><text class="op" x="480" y="259">+</text>
<circle class="node" cx="660" cy="250" r="34"/><text class="op" x="660" y="259">−</text>
<circle class="node" cx="830" cy="250" r="34"/><text class="op" x="830" y="259">x²</text>
<rect class="inp" x="895" y="226" width="90" height="48" rx="8"/><text class="lab" x="940" y="257">loss 4</text>
<path class="fw" d="M864,240 L887,240" marker-end="url(#af)"/>
<text class="grad" x="940" y="300">1</text><text class="small" x="940" y="320">start here</text>
<path class="bw" d="M895,262 L872,262" marker-end="url(#ab)"/>
<text class="small" x="82" y="222">raising w initially</text><text class="small" x="82" y="242">lowers the loss</text>
<text class="small" x="830" y="330">slope of a square:</text><text class="small" x="830" y="350">2 × (−2) = −4</text>
<text class="small" x="300" y="330">slope for w is x:</text><text class="small" x="300" y="350">−4 × 2 = −8</text>
<text class="small" x="110" y="425">data (dashed boxes)</text><text class="small" x="110" y="445">not optimized here</text>
<rect x="40" y="478" width="920" height="60" rx="5" fill="#f2f2f2"/>
<text class="lab" x="500" y="503">Backward, each operation multiplies the gradient arriving from above</text>
<text class="lab" x="500" y="527">by its own local slope and passes the result on: the chain rule, run by the framework.</text>
