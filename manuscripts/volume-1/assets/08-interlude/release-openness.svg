<svg xmlns="http://www.w3.org/2000/svg" width="700" height="392" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">What a release opens</title>
<desc id="desc">A table comparing three ways of releasing a trained model. Service only, through an API: no weights, no code, no training code, no training data, and the provider's terms; you can run it only on the provider's machines. Open weights: the weights and the code to run them, tokenizer and configuration are released; complete training code and detailed data information are not required by that label alone, and the license may restrict uses; you can run it and fine-tune it. Open-source AI as defined by the Open Source Initiative: weights, code to run it, complete training code, and sufficiently detailed data information, under terms that allow any purpose; you can run, fine-tune, study and rebuild it.</desc>
<rect width="1000" height="560" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717;text-anchor:middle}.title{font-size:28px;font-weight:700}.head{font-size:19px;font-weight:700}.sub{font-size:16px;fill:#444}.row{font-size:18px;text-anchor:end}.cell{font-size:17px}.cap{font-size:16px;font-weight:700}.small{font-size:16px;fill:#444}</style>
<text class="title" x="500" y="42">What a release opens</text>
<text class="head" x="435.0" y="114">service only</text>
<text class="sub" x="435.0" y="136">(an API)</text>
<text class="head" x="645.0" y="114">open weights</text>
<text class="head" x="855.0" y="114">open-source AI</text>
<text class="sub" x="855.0" y="136">(OSI definition)</text>
<text class="row" x="314" y="184">the weights</text>
<rect x="336" y="156" width="198" height="44" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
<text class="cell" x="435.0" y="184">no</text>
<rect x="546" y="156" width="198" height="44" rx="6" fill="#9b9b9b" stroke="#555" stroke-width="1.4"/>
<text class="cell" x="645.0" y="184">yes</text>
<rect x="756" y="156" width="198" height="44" rx="6" fill="#9b9b9b" stroke="#555" stroke-width="1.4"/>
<text class="cell" x="855.0" y="184">yes</text>
<text class="row" x="314" y="240">runtime / tokenizer / config</text>
<rect x="336" y="212" width="198" height="44" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
<text class="cell" x="435.0" y="240">no</text>
<rect x="546" y="212" width="198" height="44" rx="6" fill="#9b9b9b" stroke="#555" stroke-width="1.4"/>
<text class="cell" x="645.0" y="240">varies</text>
<rect x="756" y="212" width="198" height="44" rx="6" fill="#9b9b9b" stroke="#555" stroke-width="1.4"/>
<text class="cell" x="855.0" y="240">yes</text>
<text class="row" x="314" y="296">complete training code</text>
<rect x="336" y="268" width="198" height="44" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
<text class="cell" x="435.0" y="296">no</text>
<rect x="546" y="268" width="198" height="44" rx="6" fill="#d6d6d6" stroke="#555" stroke-width="1.4"/>
<text class="cell" x="645.0" y="296">not required</text>
<rect x="756" y="268" width="198" height="44" rx="6" fill="#9b9b9b" stroke="#555" stroke-width="1.4"/>
<text class="cell" x="855.0" y="296">yes</text>
<text class="row" x="314" y="342">detailed training-data</text><text class="row" x="314" y="362">information</text>
<rect x="336" y="324" width="198" height="44" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
<text class="cell" x="435.0" y="352">no</text>
<rect x="546" y="324" width="198" height="44" rx="6" fill="#ececec" stroke="#555" stroke-width="1.4"/>
<text class="cell" x="645.0" y="352">not required</text>
<rect x="756" y="324" width="198" height="44" rx="6" fill="#9b9b9b" stroke="#555" stroke-width="1.4"/>
<text class="cell" x="855.0" y="352">yes</text>
<text class="row" x="314" y="408">terms of use</text>
<rect x="336" y="380" width="198" height="44" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
<text class="cell" x="435.0" y="408">provider's</text>
<rect x="546" y="380" width="198" height="44" rx="6" fill="#d6d6d6" stroke="#555" stroke-width="1.4"/>
<text class="cell" x="645.0" y="408">may restrict</text>
<rect x="756" y="380" width="198" height="44" rx="6" fill="#9b9b9b" stroke="#555" stroke-width="1.4"/>
<text class="cell" x="855.0" y="408">any purpose</text>
<line x1="30" y1="444" x2="960" y2="444" stroke="#222" stroke-width="2"/>
<text class="row" x="314" y="482" style="font-weight:700">what you can do</text>
<text class="cap" x="435.0" y="475">use their service</text>
<text class="cap" x="645.0" y="475">run, adapt</text><text class="small" x="645.0" y="496">within its terms</text>
<text class="cap" x="855.0" y="475">use, study, modify, share</text>
<text class="small" x="500" y="536">Simplified release packages. OSI requires enough data information for substantial equivalence.</text>
