<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160" width="1200" height="1160" role="img" aria-labelledby="title desc">
<title id="title">From a signal to a changed connection</title>
<desc id="desc">An original grayscale process schematic: integration and spikes in a cortical neuron; glutamate release, AMPA current and NMDA magnesium blockade at a chemical synapse; and a recurrent excitatory circuit with inhibitory feedback. Not to scale.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#222"/></marker><marker id="bar" viewBox="0 0 10 16" refX="6" refY="8" markerWidth="10" markerHeight="16" orient="auto"><path d="M 6 1 L 6 15" stroke="#222" stroke-width="2"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:25px} .title{font-weight:700;font-size:30px}.small{font-size:23px}.tiny{font-size:21px}.line{stroke:#222;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.fine{stroke:#555;stroke-width:2;fill:none}.panel{fill:#fafafa;stroke:#777;stroke-width:1.4}</style>
<rect width="1200" height="1160" fill="white"/>

<rect class="panel" x="15" y="15" width="1170" height="285" rx="10"/>
<rect class="panel" x="15" y="320" width="1170" height="490" rx="10"/>
<rect class="panel" x="15" y="830" width="1170" height="315" rx="10"/>
<text x="40" y="58" class="title">A   Integrate → fire → transmit</text>
<path class="line" d="M 330 170 L 250 122 L 210 90 M 250 122 L 178 132 M 330 170 L 242 185 L 185 173 M 242 185 L 200 229 M 330 170 L 285 225 L 260 250"/>
<circle cx="330" cy="170" r="39" fill="#e0e0e0" stroke="#222" stroke-width="3"/>
<circle cx="330" cy="170" r="12" fill="white" stroke="#222" stroke-width="3"/>
<path class="line" d="M 370 170 L 905 170" marker-end="url(#arrow)"/>
<rect x="490" y="155" width="75" height="30" rx="14" fill="#d8d8d8" stroke="#555" stroke-width="2"/>
<rect x="590" y="155" width="75" height="30" rx="14" fill="#d8d8d8" stroke="#555" stroke-width="2"/>
<rect x="690" y="155" width="75" height="30" rx="14" fill="#d8d8d8" stroke="#555" stroke-width="2"/>
<rect x="790" y="155" width="75" height="30" rx="14" fill="#d8d8d8" stroke="#555" stroke-width="2"/>
<path class="line" d="M 906 170 L 965 116 M 906 170 L 982 174 M 906 170 L 965 230"/>
<circle cx="965" cy="116" r="9" fill="#666" stroke="#222" stroke-width="3"/>
<circle cx="982" cy="174" r="9" fill="#666" stroke="#222" stroke-width="3"/>
<circle cx="965" cy="230" r="9" fill="#666" stroke="#222" stroke-width="3"/>
<text x="40" y="115">Excitation (+)</text>
<path class="line" d="M 165 112 L 216 132" marker-end="url(#arrow)"/>
<text x="40" y="210">Inhibition (−)</text>
<path class="line" d="M 175 205 L 232 184" marker-end="url(#bar)"/>
<text x="290" y="105">Cell body</text>
<text x="520" y="123">Axon: spike propagation</text>
<text x="1000" y="168">Chemical</text>
<text x="1000" y="198">synapses</text>
<path class="fine" d="M 423 149 L 423 106"/>
<text x="402" y="92" class="small">Threshold</text>
<text x="318" y="273" class="small">Inputs vary; spikes signal through timing, rate and population activity.</text>
<text x="40" y="363" class="title">B   A glutamatergic synapse: transmission and coincidence</text>
<path d="M 75 410 L 75 508 Q 75 541 110 541 L 490 541 Q 525 541 525 508 L 525 410" fill="#eee" stroke="#333" stroke-width="3"/>
<text x="100" y="432" class="small">Sending axon terminal</text>
<circle cx="180" cy="472" r="19" fill="white" stroke="#222" stroke-width="3"/>
<circle cx="175" cy="468" r="2" fill="#222" stroke="#222" stroke-width="3"/>
<circle cx="186" cy="470" r="2" fill="#222" stroke="#222" stroke-width="3"/>
<circle cx="180" cy="479" r="2" fill="#222" stroke="#222" stroke-width="3"/>
<circle cx="270" cy="481" r="19" fill="white" stroke="#222" stroke-width="3"/>
<circle cx="265" cy="477" r="2" fill="#222" stroke="#222" stroke-width="3"/>
<circle cx="276" cy="479" r="2" fill="#222" stroke="#222" stroke-width="3"/>
<circle cx="270" cy="488" r="2" fill="#222" stroke="#222" stroke-width="3"/>
<circle cx="360" cy="474" r="19" fill="white" stroke="#222" stroke-width="3"/>
<circle cx="355" cy="470" r="2" fill="#222" stroke="#222" stroke-width="3"/>
<circle cx="366" cy="472" r="2" fill="#222" stroke="#222" stroke-width="3"/>
<circle cx="360" cy="481" r="2" fill="#222" stroke="#222" stroke-width="3"/>
<path class="line" d="M 445 445 L 445 500" marker-end="url(#arrow)"/>
<text x="415" y="421" class="small">Ca²⁺</text>
<text x="548" y="481" class="small">Spike → Ca²⁺ entry</text>
<text x="548" y="515" class="small">→ vesicle release</text>
<circle cx="190" cy="562" r="4" fill="#222" stroke="#222" stroke-width="3"/>
<circle cx="249" cy="569" r="4" fill="#222" stroke="#222" stroke-width="3"/>
<circle cx="303" cy="556" r="4" fill="#222" stroke="#222" stroke-width="3"/>
<circle cx="351" cy="580" r="4" fill="#222" stroke="#222" stroke-width="3"/>
<circle cx="404" cy="565" r="4" fill="#222" stroke="#222" stroke-width="3"/>
<circle cx="219" cy="587" r="4" fill="#222" stroke="#222" stroke-width="3"/>
<text x="80" y="577" class="tiny">Glutamate</text>
<path class="line" d="M 75 616 L 200 616 M 240 616 L 365 616 M 405 616 L 525 616"/>
<path class="line" d="M 75 640 L 200 640 M 240 640 L 365 640 M 405 640 L 525 640"/>
<path d="M 200 603 L 200 651 M 240 603 L 240 651" class="line"/>
<path d="M 365 603 L 365 651 M 405 603 L 405 651" class="line"/>
<text x="175" y="684" class="small">AMPA</text>
<text x="347" y="684" class="small">NMDA</text>
<path class="line" d="M 220 596 L 220 655" marker-end="url(#arrow)"/>
<circle cx="385" cy="627" r="13" fill="#bbb" stroke="#222" stroke-width="3"/>
<text x="430" y="601" class="small">Mg²⁺ block</text>
<path class="fine" d="M 443 607 L 402 623"/>
<text x="90" y="728" class="small">Receiving dendrite</text>
<text x="90" y="766" class="small">AMPA current can help depolarize it.</text>
<rect x="628" y="556" width="518" height="224" rx="8" fill="white" stroke="#777" stroke-width="1.5"/>
<text x="650" y="592" class="small">NMDA current needs both:</text>
<text x="650" y="630" class="small">• Glutamate + co-agonist binding</text>
<text x="650" y="665" class="small">• Depolarization easing Mg²⁺ block</text>
<text x="650" y="707" class="small">Ca²⁺ entry → biochemical signaling</text>
<text x="650" y="746" class="small">→ synaptic strength can change</text>
<text x="40" y="872" class="title">C   Activity returns through the circuit</text>
<circle cx="160" cy="962" r="31" fill="white" stroke="#222" stroke-width="3"/>
<text x="160" y="971" text-anchor="middle">E₁</text>
<circle cx="465" cy="962" r="31" fill="white" stroke="#222" stroke-width="3"/>
<text x="465" y="971" text-anchor="middle">E₂</text>
<circle cx="315" cy="1090" r="31" fill="#d0d0d0" stroke="#222" stroke-width="3"/>
<text x="315" y="1099" text-anchor="middle">I</text>
<path class="line" d="M 190 949 C 265 909 355 909 435 949" marker-end="url(#arrow)"/>
<path class="line" d="M 435 978 C 355 1018 265 1018 190 978" marker-end="url(#arrow)"/>
<path class="line" d="M 444 989 L 340 1070" marker-end="url(#arrow)"/>
<path class="line" d="M 288 1075 L 180 990" marker-end="url(#bar)"/>
<path class="line" d="M 62 962 L 125 962" marker-end="url(#arrow)"/>
<path class="line" d="M 499 962 L 566 962" marker-end="url(#arrow)"/>
<text x="626" y="928" class="small">E: excitatory cell     I: inhibitory cell</text>
<path class="line" d="M 630 971 L 692 971" marker-end="url(#arrow)"/>
<text x="714" y="979" class="small">Excitatory influence</text>
<path class="line" d="M 630 1017 L 692 1017" marker-end="url(#bar)"/>
<text x="714" y="1025" class="small">Inhibitory influence</text>
<text x="626" y="1073" class="small">Recurrence provides feedback; inhibition</text>
<text x="626" y="1110" class="small">helps constrain and shape the activity.</text>
</svg>