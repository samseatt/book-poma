<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">An order as a machine of states</title>
<desc id="desc">A row of states: received, approved, shipped, invoiced and paid, joined by arrows. From received, an order over the limit branches up to a dashed box, waiting for a manager, which returns to approved after a signature; a timer sends a reminder after two days. Below approved, a loop retries a failed dispatch only after confirming that nothing shipped. A note says the path is designed in advance and the software only walks it.</desc>
<rect width="1000" height="500" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717;text-anchor:middle}.title{font-size:28px;font-weight:700}.head{font-size:19px;font-weight:700}.label{font-size:18px}.small{font-size:16px;fill:#444}.box{fill:#fff;stroke:#222;stroke-width:2.2}.person{fill:#e4e4e4;stroke:#222;stroke-width:2.2;stroke-dasharray:7 5}.wire{stroke:#222;stroke-width:2.4;fill:none}.dash{stroke:#666;stroke-width:2;fill:none;stroke-dasharray:6 5}.axis{stroke:#222;stroke-width:2;fill:none}.ok{fill:#d6d6d6;stroke:#555;stroke-width:1.6;fill-opacity:.85}.bad{fill:#8f8f8f;stroke:#333;stroke-width:1.6;fill-opacity:.7}.band{stroke:none}</style>
<defs><marker id="arr" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.6"/></marker></defs>
<text class="title" x="500" y="42">An order as a machine of states</text>
<rect class="box" x="48.0" y="222.0" width="124" height="56" rx="28"/><text class="label" x="110" y="256">received</text>
<rect class="box" x="238.0" y="222.0" width="124" height="56" rx="28"/><text class="label" x="300" y="256">approved</text>
<rect class="box" x="428.0" y="222.0" width="124" height="56" rx="28"/><text class="label" x="490" y="256">shipped</text>
<rect class="box" x="618.0" y="222.0" width="124" height="56" rx="28"/><text class="label" x="680" y="256">invoiced</text>
<rect class="box" x="808.0" y="222.0" width="124" height="56" rx="28"/><text class="label" x="870" y="256">paid</text>
<path class="wire" d="M172.0,250 H234.0" marker-end="url(#arr)"/>
<path class="wire" d="M362.0,250 H424.0" marker-end="url(#arr)"/>
<path class="wire" d="M552.0,250 H614.0" marker-end="url(#arr)"/>
<path class="wire" d="M742.0,250 H804.0" marker-end="url(#arr)"/>
<text class="small" x="205.0" y="216" style="font-size:14px">within</text><text class="small" x="205.0" y="234" style="font-size:14px">limit</text>
<text class="small" x="395.0" y="216" style="font-size:14px">dispatch</text><text class="small" x="395.0" y="234" style="font-size:14px">confirmed</text>
<text class="small" x="585.0" y="216" style="font-size:14px">delivered</text><text class="small" x="585.0" y="234" style="font-size:14px"></text>
<text class="small" x="775.0" y="216" style="font-size:14px">paid in</text><text class="small" x="775.0" y="234" style="font-size:14px">full</text>
<rect class="person" x="135" y="96" width="190" height="62" rx="8"/><text class="label" x="230" y="122">waiting for</text><text class="label" x="230" y="145">a manager</text>
<path class="wire" d="M90,222.0 V127 H131" marker-end="url(#arr)"/><text class="small" x="82" y="190" style="text-anchor:end">over</text><text class="small" x="82" y="208" style="text-anchor:end">limit</text>
<path class="wire" d="M310,158 V218.0" marker-end="url(#arr)"/><text class="small" x="318" y="196" style="text-anchor:start">signed</text>
<path class="dash" d="M325,110 H420"/><text class="small" x="430" y="115" style="text-anchor:start">after two days: remind</text>
<path class="wire" d="M270,278.0 C270,360 330,360 330,282.0" marker-end="url(#arr)"/>
<text class="small" x="300" y="378">dispatch failed: retry,</text><text class="small" x="300" y="398">only after confirming that nothing shipped</text>
<rect x="40" y="420" width="920" height="56" rx="5" fill="#f2f2f2"/><text class="label" x="500" y="454">The path is designed in advance; the software only walks it. Some steps wait for a person.</text>
</svg>