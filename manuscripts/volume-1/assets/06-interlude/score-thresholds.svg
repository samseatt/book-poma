<svg xmlns="http://www.w3.org/2000/svg" width="700" height="364" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">A score is not a decision</title>
<desc id="desc">A horizontal axis shows a fraud model's score from 0 to 1. Two overlapping humps show how scores fall for legitimate transactions, mostly low, and for fraudulent ones, mostly high; they overlap in the middle. Two thresholds divide the axis into three bands: below the first, let through; between them, ask a person; above the second, block. The review band is a policy choice; overlapping score distributions do not guarantee that a reviewer can classify every case correctly. The curves are schematic, not measured prevalence.</desc>
<rect width="1000" height="520" fill="white"/>
