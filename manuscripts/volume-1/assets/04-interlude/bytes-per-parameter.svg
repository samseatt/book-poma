<svg xmlns="http://www.w3.org/2000/svg" width="700" height="371" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Bytes per parameter</title>
<desc id="desc">Stacked bars of memory per model parameter. Mixed-precision training with Adam: 2 bytes for the 16-bit weight, 2 for the 16-bit gradient, 4 for the 32-bit master weight, 4 for Adam's first moment and 4 for its second, 16 bytes in all; 6.5 terabytes for a 405-billion-parameter model. Serving keeps only the weights: 2 bytes at BF16 (810 gigabytes for that model), 1 byte at FP8 (405 gigabytes) and half a byte at FP4 (about 200 gigabytes). Activations and the key-value cache are extra.</desc>
<rect width="1000" height="530" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.label{font-size:19px}.small{font-size:16px;fill:#444}.seg{stroke:#fff;stroke-width:2}.tick{font-size:15px;fill:#444}.grid{stroke:#e2e2e2;stroke-width:1}</style>
<text class="title" x="40" y="50">Where a parameter's bytes go</text>
<text class="head" x="860" y="104">405B model</text>
<line class="grid" x1="200" y1="120" x2="200" y2="460"/><text class="tick" x="200" y="482" text-anchor="middle">0</text>
<line class="grid" x1="280" y1="120" x2="280" y2="460"/><text class="tick" x="280" y="482" text-anchor="middle">2</text>
<line class="grid" x1="360" y1="120" x2="360" y2="460"/><text class="tick" x="360" y="482" text-anchor="middle">4</text>
<line class="grid" x1="440" y1="120" x2="440" y2="460"/><text class="tick" x="440" y="482" text-anchor="middle">6</text>
<line class="grid" x1="520" y1="120" x2="520" y2="460"/><text class="tick" x="520" y="482" text-anchor="middle">8</text>
<line class="grid" x1="600" y1="120" x2="600" y2="460"/><text class="tick" x="600" y="482" text-anchor="middle">10</text>
<line class="grid" x1="680" y1="120" x2="680" y2="460"/><text class="tick" x="680" y="482" text-anchor="middle">12</text>
<line class="grid" x1="760" y1="120" x2="760" y2="460"/><text class="tick" x="760" y="482" text-anchor="middle">14</text>
<line class="grid" x1="840" y1="120" x2="840" y2="460"/><text class="tick" x="840" y="482" text-anchor="middle">16</text>
<text class="label" x="520" y="512" text-anchor="middle">bytes per parameter</text>
<text class="head" x="184" y="170" text-anchor="end">Training</text><text class="small" x="184" y="194" text-anchor="end">mixed precision, Adam</text>
<rect class="seg" x="200" y="130" width="80" height="90" fill="#5f5f5f"/>
<text class="small" x="240.0" y="168" text-anchor="middle" style="fill:#fff">weight</text><text class="small" x="240.0" y="190" text-anchor="middle" style="fill:#fff">16-bit</text>
<rect class="seg" x="280" y="130" width="80" height="90" fill="#8a8a8a"/>
<text class="small" x="320.0" y="168" text-anchor="middle" style="fill:#171717">gradient</text><text class="small" x="320.0" y="190" text-anchor="middle" style="fill:#171717">16-bit</text>
<rect class="seg" x="360" y="130" width="160" height="90" fill="#b3b3b3"/>
<text class="small" x="440.0" y="168" text-anchor="middle" style="fill:#171717">master weight</text><text class="small" x="440.0" y="190" text-anchor="middle" style="fill:#171717">32-bit</text>
<rect class="seg" x="520" y="130" width="160" height="90" fill="#cfcfcf"/>
<text class="small" x="600.0" y="168" text-anchor="middle" style="fill:#171717">Adam average 1</text><text class="small" x="600.0" y="190" text-anchor="middle" style="fill:#171717">32-bit</text>
<rect class="seg" x="680" y="130" width="160" height="90" fill="#e4e4e4"/>
<text class="small" x="760.0" y="168" text-anchor="middle" style="fill:#171717">Adam average 2</text><text class="small" x="760.0" y="190" text-anchor="middle" style="fill:#171717">32-bit</text>
<text class="head" x="860" y="182">6.5 TB</text>
<text class="head" x="184" y="256" text-anchor="end">Serving</text><text class="small" x="200" y="256">weights only</text>
<text class="label" x="184" y="303" text-anchor="end">BF16</text><rect class="seg" x="200" y="270" width="80" height="50" fill="#5f5f5f"/>
<text class="small" x="292" y="302">2 bytes</text><text class="head" x="860" y="303">810 GB</text>
<text class="label" x="184" y="365" text-anchor="end">FP8</text><rect class="seg" x="200" y="332" width="40" height="50" fill="#5f5f5f"/>
<text class="small" x="252" y="364">1 byte</text><text class="head" x="860" y="365">405 GB</text>
<text class="label" x="184" y="427" text-anchor="end">FP4</text><rect class="seg" x="200" y="394" width="20.0" height="50" fill="#5f5f5f"/>
<text class="small" x="232.0" y="426">0.5 byte</text><text class="head" x="860" y="427">≈ 200 GB</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>