<svg xmlns="http://www.w3.org/2000/svg" width="700" height="434" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Machine-learning workloads on the roofline</title>
<desc id="desc">Log-log roofline for a B200-class GPU using dense FP8 throughput of 4.5 petaoperations per second and HBM bandwidth of 7.7 terabytes per second. The ridge point is about 584 operations per byte. A bias-plus-activation step at 0.25 operations per byte and decoding for one user at about 2 sit far down the memory-bound slope; decoding a batch of 64 at about 128 sits higher; reading a 2,048-token prompt (prefill) at about 4,096 sits on the compute roof.</desc>
<rect width="1000" height="620" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717}.title{font-size:28px;font-weight:700}.label{font-size:19px}.small{font-size:16px;fill:#444}.tick{font-size:16px;fill:#444}.axis{stroke:#222;stroke-width:2;fill:none}.grid{stroke:#e2e2e2;stroke-width:1}.roof{stroke:#222;stroke-width:3.5;fill:none}.ext{stroke:#9b9b9b;stroke-width:2;stroke-dasharray:7 6;fill:none}.pt{fill:#555;stroke:#fff;stroke-width:2.5}.lead{stroke:#666;stroke-width:1.4;fill:none}</style>
<line class="grid" x1="140.0" y1="90" x2="140.0" y2="520"/><line class="grid" x1="140" y1="520.0" x2="950" y2="520.0"/>
<text class="tick" x="140.0" y="546" text-anchor="middle">0.1</text>
<text class="tick" x="128" y="525.0" text-anchor="end">0.1</text>
<line class="grid" x1="302.0" y1="90" x2="302.0" y2="520"/><line class="grid" x1="140" y1="434.0" x2="950" y2="434.0"/>
<text class="tick" x="302.0" y="546" text-anchor="middle">1</text>
<text class="tick" x="128" y="439.0" text-anchor="end">1</text>
<line class="grid" x1="464.0" y1="90" x2="464.0" y2="520"/><line class="grid" x1="140" y1="348.0" x2="950" y2="348.0"/>
<text class="tick" x="464.0" y="546" text-anchor="middle">10</text>
<text class="tick" x="128" y="353.0" text-anchor="end">10</text>
<line class="grid" x1="626.0" y1="90" x2="626.0" y2="520"/><line class="grid" x1="140" y1="262.0" x2="950" y2="262.0"/>
<text class="tick" x="626.0" y="546" text-anchor="middle">100</text>
<text class="tick" x="128" y="267.0" text-anchor="end">100</text>
<line class="grid" x1="788.0" y1="90" x2="788.0" y2="520"/><line class="grid" x1="140" y1="176.0" x2="950" y2="176.0"/>
<text class="tick" x="788.0" y="546" text-anchor="middle">1,000</text>
<text class="tick" x="128" y="181.0" text-anchor="end">1,000</text>
<line class="grid" x1="950.0" y1="90" x2="950.0" y2="520"/><line class="grid" x1="140" y1="90.0" x2="950" y2="90.0"/>
<text class="tick" x="950.0" y="546" text-anchor="middle">10,000</text>
<text class="tick" x="128" y="95.0" text-anchor="end">10,000</text>
<path class="axis" d="M140,90 V520 H950"/>
<text class="label" x="545.0" y="582" text-anchor="middle">Arithmetic intensity (operations per byte moved from HBM)</text>
<text class="label" transform="translate(42,305.0) rotate(-90)" text-anchor="middle">Attainable throughput (trillion operations/s)</text>
<path class="roof" d="M140,443.8 L750.2,119.8 H950"/>
<text class="title" x="140" y="50">Where the work sits on the roofline</text>
<text class="label" x="950" y="79.8" text-anchor="end">compute roof</text><text class="small" x="950" y="103.8" text-anchor="end">4.5 petaoperations/s, dense FP8</text>
<text class="label" transform="translate(217.3,388.7) rotate(-28.0)" >memory slope: 7.7 TB/s × intensity</text>
<line class="lead" x1="750.2" y1="119.8" x2="750.2" y2="520" stroke-dasharray="4 5"/>
<text class="small" x="758.2" y="508">ridge ≈ 584</text>
<line class="lead" x1="204.5" y1="409.5" x2="228.5" y2="437.5"/>
<circle class="pt" cx="204.5" cy="409.5" r="8"/>
<text class="label" x="228.5" y="457.5" text-anchor="start">bias + activation, unfused</text><text class="small" x="228.5" y="477.5" text-anchor="start">≈ 0.25</text>
<line class="lead" x1="350.8" y1="331.9" x2="374.8" y2="359.9"/>
<circle class="pt" cx="350.8" cy="331.9" r="8"/>
<text class="label" x="374.8" y="379.9" text-anchor="start">decoding, one user</text><text class="small" x="374.8" y="399.9" text-anchor="start">≈ 2</text>
<line class="lead" x1="643.4" y1="176.5" x2="627.4" y2="96.5"/>
<circle class="pt" cx="643.4" cy="176.5" r="8"/>
<text class="label" x="627.4" y="116.5" text-anchor="end">decoding, batch of 64</text><text class="small" x="627.4" y="136.5" text-anchor="end">≈ 128</text>
<line class="lead" x1="887.2" y1="119.8" x2="887.2" y2="213.8"/>
<circle class="pt" cx="887.2" cy="119.8" r="8"/>
<text class="label" x="887.2" y="233.8" text-anchor="end">prefill, 2,048-token prompt</text><text class="small" x="887.2" y="253.8" text-anchor="end">≈ 4,096</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>