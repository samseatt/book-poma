<svg xmlns="http://www.w3.org/2000/svg" width="700" height="406" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">One GPU made of two dies</title>
<desc id="desc">Schematic of a Blackwell B200 package. Two compute dies sit side by side inside one package and are joined by a fast die-to-die link, so software sees one GPU. Each die holds many streaming multiprocessors, each with Tensor Cores, and an L2 cache. Four stacks of HBM3e memory sit beside each die, two above and two below. NVLink connections lead off the package to other GPUs. On the left, a host CPU outside the package runs the program and the control plane, launching kernels onto the GPU and moving data to it. Not to scale.</desc>
<rect width="1000" height="580" fill="white"/>
