<svg xmlns="http://www.w3.org/2000/svg" width="700" height="392" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">How a story thickens</title>
<desc id="desc">Four horizontal bars on a logarithmic time axis from a quarter year to ten thousand years, one for each depth a story can sink to. Expectation lasts from a season to about a generation; example, weekly mass in Quebec. Habit lasts about a lifetime and can be passed on; example, the culture of honor measured in a hallway. Stone lasts centuries; examples, Roman roads, the colonial mining draft in Peru and redlined streets. Genes last thousands of years; example, lactase persistence. A downward arrow on the left marks the direction of sinking: deeper means slower to undo. Spans illustrate the author’s hypothesized ordering, not estimates from the cited studies.</desc>
<rect width="1000" height="560" fill="white"/>
