<svg xmlns="http://www.w3.org/2000/svg" width="700" height="392" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Better reasoners, wider gap</title>
<desc id="desc">A schematic, not data. The horizontal axis is science literacy and numeracy, from low to high; the vertical axis is perceived climate risk. Two lines, one for egalitarian communitarians and one for hierarchical individualists, start close together at low literacy and spread apart as literacy rises: one rises, the other falls. A bracket at the right marks the widened gap. The pattern follows Kahan and colleagues (2012); the shape is illustrative.</desc>
<rect width="1000" height="560" fill="white"/>
