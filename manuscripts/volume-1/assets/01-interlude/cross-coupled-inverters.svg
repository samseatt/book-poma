<svg xmlns="http://www.w3.org/2000/svg" width="700" height="392" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">A tiny argument that never ends</title>
<desc id="desc">Two copies of the same circuit: two inverters wired in a loop, so that the output of inverter A feeds inverter B and the output of B feeds back into A. In the left copy, A outputs 1 and B outputs 0, so the stored bit Q is 1. In the right copy, A outputs 0 and B outputs 1, so Q is 0. Each inverter keeps the other in place; either state holds itself while the power stays on.</desc>
<rect width="1000" height="560" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717;text-anchor:middle}.title{font-size:28px;font-weight:700}.head{font-size:23px;font-weight:700}.label{font-size:20px}.small{font-size:18px;fill:#444}.axis{stroke:#777;stroke-width:1.6;fill:none}.full{fill:#9b9b9b;stroke:#222;stroke-width:2}.empty{fill:#f2f2f2;stroke:#222;stroke-width:2}.wire{stroke:#222;stroke-width:2.6;fill:none}.gate{fill:#fff;stroke:#222;stroke-width:2.6}.curve{stroke:#111;stroke-width:3;fill:none}.guide{stroke:#999;stroke-width:1.4;stroke-dasharray:6 5;fill:none}</style>
<defs><marker id="arr" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.6"/></marker></defs>
<text x="500" y="38" class="title">A tiny argument that never ends</text><path class="gate" d="M210 150 L210 230 L290 190 Z"/><circle class="gate" cx="298" cy="190" r="8"/><path class="gate" d="M310 290 L310 370 L230 330 Z"/><circle class="gate" cx="222" cy="330" r="8"/><path class="wire" d="M306 190 H390 V330 H310"/><path class="wire" d="M214 330 H130 V190 H210"/><circle cx="390" cy="190" r="5" fill="#222"/><circle cx="130" cy="330" r="5" fill="#222"/><path class="wire" d="M390 190 H450"/><text x="460" y="197" class="head" style="text-anchor:start">Q</text><text x="360" y="176" class="head">1</text><text x="160" y="358" class="head">0</text><text x="250" y="138" class="small">inverter A</text><text x="270" y="398" class="small">inverter B</text><text x="260" y="446" class="label">Q holds 1</text><path class="gate" d="M680 150 L680 230 L760 190 Z"/><circle class="gate" cx="768" cy="190" r="8"/><path class="gate" d="M780 290 L780 370 L700 330 Z"/><circle class="gate" cx="692" cy="330" r="8"/><path class="wire" d="M776 190 H860 V330 H780"/><path class="wire" d="M684 330 H600 V190 H680"/><circle cx="860" cy="190" r="5" fill="#222"/><circle cx="600" cy="330" r="5" fill="#222"/><path class="wire" d="M860 190 H920"/><text x="930" y="197" class="head" style="text-anchor:start">Q</text><text x="830" y="176" class="head">0</text><text x="630" y="358" class="head">1</text><text x="720" y="138" class="small">inverter A</text><text x="740" y="398" class="small">inverter B</text><text x="730" y="446" class="label">Q holds 0</text><rect x="40" y="470" width="920" height="70" rx="5" fill="#f2f2f2"/><text x="500" y="500" class="label">Each inverter's output holds the other's input where it is.</text><text x="500" y="526" class="label">Either state keeps itself, for as long as the power stays on.</text>
