<svg xmlns="http://www.w3.org/2000/svg" width="700" height="364" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">A one-way door made of sand</title>
<desc id="desc">Left: a p–n junction. The p-type side holds mobile holes and the n-type side mobile electrons; between them is a depletion layer of fixed negative charges on the p side and fixed positive charges on the n side, whose field pushes back against further diffusion. Right: the diode curve. In the forward direction the current rises exponentially, about tenfold for every 60 millivolts at room temperature; in reverse only a small leakage current flows, drawn larger than life. A note gives the ideal diode equation, I equals I-s times the quantity e to the qV over kT minus one.</desc>
