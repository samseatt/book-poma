<svg xmlns="http://www.w3.org/2000/svg" width="700" height="396" viewBox="0 0 1000 566" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Bands, gaps and three personalities</title>
<desc id="desc">Three energy-band diagrams. A conductor such as copper has one band only partly filled, so electrons have empty states just above them. A semiconductor such as silicon has a filled band and an empty band separated by a narrow gap of about 1.1 electron-volts; a few electrons have been lifted across, leaving holes behind. An insulator such as quartz has a filled band separated from the empty band by a wide gap of about 9 electron-volts. Schematic, not to scale.</desc>
<rect width="1000" height="566" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717;text-anchor:middle}.title{font-size:28px;font-weight:700}.head{font-size:23px;font-weight:700}.label{font-size:20px}.small{font-size:18px;fill:#444}.axis{stroke:#777;stroke-width:1.6;fill:none}.full{fill:#9b9b9b;stroke:#222;stroke-width:2}.empty{fill:#f2f2f2;stroke:#222;stroke-width:2}.wire{stroke:#222;stroke-width:2.6;fill:none}.gate{fill:#fff;stroke:#222;stroke-width:2.6}.curve{stroke:#111;stroke-width:3;fill:none}.guide{stroke:#999;stroke-width:1.4;stroke-dasharray:6 5;fill:none}</style>
<defs><marker id="arr" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.6"/></marker></defs>
<text x="500" y="38" class="title">Bands, gaps and three personalities</text><rect x="300" y="58" width="22" height="16" class="full"/><text x="380" y="72" class="small">filled states</text><rect x="470" y="58" width="22" height="16" class="empty"/><text x="552" y="72" class="small">empty states</text><path d="M48 470 V112" class="axis" marker-end="url(#arr)"/><text x="40" y="300" class="small" transform="rotate(-90 40 300)">electron energy</text><rect x="115.0" y="150" width="190" height="140" class="empty"/><rect x="115.0" y="290" width="190" height="150" class="full"/><path d="M103.0 290 H317.0" class="guide"/><text x="210" y="140" class="small">one band, partly filled</text><text x="210" y="372" class="small" style="fill:#111">filled to here;</text><text x="210" y="394" class="small" style="fill:#111">empty seats above</text><text x="210" y="490" class="head">Conductor</text><text x="210" y="516" class="label">copper</text><rect x="405.0" y="150" width="190" height="110" class="empty"/><rect x="405.0" y="330" width="190" height="110" class="full"/><path d="M609.0 262 V328" class="wire" marker-end="url(#arr)"/><path d="M609.0 328 V262" class="wire" marker-end="url(#arr)"/><text x="617.0" y="300" class="label" style="text-anchor:start">1.1 eV</text><circle cx="460" cy="246" r="7" fill="#111"/><circle cx="530" cy="246" r="7" fill="#111"/><circle cx="460" cy="344" r="7" fill="#fff" stroke="#111" stroke-width="2.2"/><circle cx="530" cy="344" r="7" fill="#fff" stroke="#111" stroke-width="2.2"/><text x="500" y="140" class="small">electrons kicked up</text><text x="500" y="378" class="small" style="fill:#111">holes left behind</text><text x="500" y="490" class="head">Semiconductor</text><text x="500" y="516" class="label">silicon</text><rect x="705.0" y="150" width="190" height="70" class="empty"/><rect x="705.0" y="370" width="190" height="70" class="full"/><path d="M800 224 V366" class="wire" marker-end="url(#arr)"/><path d="M800 366 V224" class="wire" marker-end="url(#arr)"/><rect x="810" y="270" width="88" height="48" fill="white"/><text x="814" y="292" class="label" style="text-anchor:start">wide gap</text><text x="814" y="314" class="label" style="text-anchor:start">≈ 9 eV</text><text x="800" y="140" class="small">almost nobody gets up here</text><text x="800" y="490" class="head">Insulator</text><text x="800" y="516" class="label">quartz</text><text x="500" y="552" class="small">Schematic; energies not to scale.</text>
