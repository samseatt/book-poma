<svg xmlns="http://www.w3.org/2000/svg" width="700" height="392" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Taste as geometry</title>
<desc id="desc">A two-dimensional taste space. An arrow from the origin marks a viewer's learned taste at (0.9, 0.4). Four videos are points: knife skills at (0.8, 0.1), kitchen playlist at (0.6, 0.7), stadium concert at (0.0, 0.9) and tax-law explainer at (-0.3, -0.2). Dashed lines perpendicular to the viewer's arrow connect points of equal score. The dot product of each video with the viewer is its score: kitchen playlist 0.82, knife skills 0.76, stadium concert 0.36, tax-law explainer -0.35. The playlist ranks first because it reaches furthest in the viewer's direction, even though knife skills lies closer to the tip of the arrow. The dimensions are labeled for illustration; a real system's dimensions have no names.</desc>
<rect width="1000" height="560" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717;text-anchor:middle}.title{font-size:28px;font-weight:700}.head{font-size:20px;font-weight:700}.label{font-size:18px}.small{font-size:16px;fill:#444}.tick{font-size:15px;fill:#444}.axis{stroke:#222;stroke-width:2;fill:none}.grid{stroke:#e4e4e4;stroke-width:1}</style>
<text class="title" x="500" y="42">Taste as geometry</text>
<defs><clipPath id="pl"><rect x="90" y="70" width="560" height="430"/></clipPath></defs>
<g clip-path="url(#pl)">
<line x1="371.9" y1="873.0" x2="-34.3" y2="-40.8" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6 6"/>
<line x1="536.6" y1="799.8" x2="130.4" y2="-114.0" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6 6"/>
<line x1="629.4" y1="758.6" x2="223.2" y2="-155.3" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6 6"/>
<line x1="643.3" y1="752.4" x2="237.1" y2="-161.4" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6 6"/>
<line class="grid" x1="90" y1="380" x2="650" y2="380" style="stroke:#bbb"/><line class="grid" x1="250" y1="70" x2="250" y2="500" style="stroke:#bbb"/>
</g>
<text class="small" x="640" y="404" style="text-anchor:end">"cooking" →</text>
<text class="small" x="260" y="86" style="text-anchor:start">↑ "music"</text>
<line x1="250.0" y1="380.0" x2="460.4" y2="286.5" stroke="#222" stroke-width="4"/><polygon points="475.0,280.0 463.6,293.8 457.1,279.2" fill="#222"/>
<text class="head" x="489.0" y="284.0" style="text-anchor:start">you</text>
<circle cx="450.0" cy="355.0" r="8" fill="#555" stroke="#fff" stroke-width="2"/>
<text class="label" x="464.0" y="377.0" style="text-anchor:start">knife skills</text>
<circle cx="400.0" cy="205.0" r="8" fill="#555" stroke="#fff" stroke-width="2"/>
<text class="label" x="414.0" y="195.0" style="text-anchor:start">kitchen playlist</text>
<circle cx="250.0" cy="155.0" r="8" fill="#555" stroke="#fff" stroke-width="2"/>
<text class="label" x="264.0" y="161.0" style="text-anchor:start">stadium concert</text>
<circle cx="175.0" cy="430.0" r="8" fill="#555" stroke="#fff" stroke-width="2"/>
<text class="label" x="175.0" y="462.0" style="text-anchor:middle">tax-law explainer</text>
<text class="head" x="700" y="120" style="text-anchor:start">score = you · video</text>
<text class="label" x="700" y="170" style="text-anchor:start;font-weight:700">1. kitchen playlist  +0.82</text>
<text class="small" x="722" y="194" style="text-anchor:start">0.9×0.6 + 0.4×0.7</text>
<text class="label" x="700" y="240" style="text-anchor:start;font-weight:700">2. knife skills  +0.76</text>
<text class="small" x="722" y="264" style="text-anchor:start">0.9×0.8 + 0.4×0.1</text>
<text class="label" x="700" y="310" style="text-anchor:start;font-weight:700">3. stadium concert  +0.36</text>
<text class="small" x="722" y="334" style="text-anchor:start">0.9×0.0 + 0.4×0.9</text>
<text class="label" x="700" y="380" style="text-anchor:start;font-weight:700">4. tax-law explainer  −0.35</text>
<text class="small" x="722" y="404" style="text-anchor:start">0.9×(−0.3) + 0.4×(−0.2)</text>
<text class="small" x="700" y="455" style="text-anchor:start">Dashed lines join equal scores.</text>
<text class="small" x="700" y="478" style="text-anchor:start">Real dimensions have no names.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>