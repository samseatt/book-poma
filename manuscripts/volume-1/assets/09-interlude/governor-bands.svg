<svg xmlns="http://www.w3.org/2000/svg" width="700" height="413" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">When the interface comes back</title>
<desc id="desc">A conjecture, drawn as a map. Permissions and hard limits override every region, even at zero surprise. The horizontal axis is surprise, how wrong the governor's prediction of what the person wants or what the world will do might be. The vertical axis is stakes, how costly or irreversible a mistake would be. Curved bands, where surprise times stakes is constant, divide the plane into three regions. Near the origin: disappear, act and keep a record; example, a balance correction. Middle band: show a seam, notify and keep it reversible; examples, the grid at a headset's play boundary and a note in an agent's log. Far corner: break through, stop and ask, or act when there is no time; examples, a person walking into the play area and automatic braking. A vertical arrow shows that the same money transfer moves up when it crosses from the person's own accounts to a stranger: crossing a boundary raises the stakes.</desc>
<rect width="1000" height="590" fill="white"/>
