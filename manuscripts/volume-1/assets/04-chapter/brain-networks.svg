<svg xmlns="http://www.w3.org/2000/svg" width="700" height="413" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">A map, not a parts list</title>
<desc id="desc">A schematic of large-scale brain networks, not an anatomical drawing. The default mode network, including medial prefrontal cortex, posterior cingulate, lateral parietal cortex and links to the hippocampus, supports self, remembering and imagining futures. The salience network, anterior insula and anterior cingulate, tracks what matters now and bodily feeling, and helps switch between the default mode network and the frontoparietal control network, lateral prefrontal and posterior parietal cortex, which holds plans and overrides habits. Beneath and between them: the amygdala, learning what matters; the ventral striatum and dopamine midbrain, wanting and prediction error; the hypothalamus, the body's set points; and ventromedial and orbitofrontal cortex, value, regret and a sense of control. Regions participate in functions; none owns one.</desc>
<rect width="1000" height="590" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717;text-anchor:middle}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.label{font-size:18px}.small{font-size:16px;fill:#444}.axis{stroke:#555;stroke-width:1.6;fill:none}.band{fill:#dedede;stroke:#444;stroke-width:1.4}.wire{stroke:#222;stroke-width:2.4;fill:none}.dash{stroke:#666;stroke-width:2;fill:none;stroke-dasharray:7 5}.box{fill:#fff;stroke:#222;stroke-width:2.2}.shade{fill:#ececec;stroke:#555;stroke-width:1.6}.node{fill:#fff;stroke:#222;stroke-width:2}.hull{fill:#f1f1f1;stroke:#555;stroke-width:1.6}.hull2{fill:#e2e2e2;stroke:#555;stroke-width:1.6}.hull3{fill:#d2d2d2;stroke:#555;stroke-width:1.6}</style>
<defs><marker id="arr" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.6"/></marker></defs>
<text x="500" y="36" class="title">A map, not a parts list</text><ellipse cx="200" cy="195" rx="185" ry="92" class="hull"/><text x="200" y="88" class="head">Default mode network</text><text x="200" y="318" class="small">self, remembering, imagining futures</text><ellipse cx="500" cy="195" rx="110" ry="78" class="hull3"/><text x="500" y="100" class="head">Salience</text><text x="500" y="318" class="small">what matters now, bodily feeling</text><ellipse cx="800" cy="195" rx="185" ry="92" class="hull2"/><text x="800" y="88" class="head">Frontoparietal control</text><text x="800" y="318" class="small">holding a plan, overriding a habit</text><rect x="43.0" y="148" width="150" height="34" rx="17" class="node"/><text x="118" y="171" class="small" style="fill:#111">medial prefrontal</text><rect x="207.0" y="148" width="150" height="34" rx="17" class="node"/><text x="282" y="171" class="small" style="fill:#111">posterior cingulate</text><rect x="43.0" y="208" width="150" height="34" rx="17" class="node"/><text x="118" y="231" class="small" style="fill:#111">lateral parietal</text><rect x="207.0" y="208" width="150" height="34" rx="17" class="node"/><text x="282" y="231" class="small" style="fill:#111">hippocampus</text><rect x="415.0" y="153" width="170" height="34" rx="17" class="node"/><text x="500" y="176" class="small" style="fill:#111">anterior insula</text><rect x="415.0" y="203" width="170" height="34" rx="17" class="node"/><text x="500" y="226" class="small" style="fill:#111">anterior cingulate</text><rect x="715.0" y="148" width="170" height="34" rx="17" class="node"/><text x="800" y="171" class="small" style="fill:#111">lateral prefrontal</text><rect x="715.0" y="213" width="170" height="34" rx="17" class="node"/><text x="800" y="236" class="small" style="fill:#111">posterior parietal</text><path class="wire" d="M390 195 H372" marker-end="url(#arr)"/><path class="wire" d="M610 195 H628" marker-end="url(#arr)"/><text x="500" y="345" class="small" style="fill:#111">the salience network helps switch between the other two</text><rect x="40" y="368" width="920" height="140" rx="10" fill="#fafafa" stroke="#888" stroke-width="1.4"/><text x="500" y="396" class="label" style="font-weight:700">beneath and between the networks</text><rect x="50.0" y="419" width="200" height="34" rx="17" class="node"/><text x="150" y="442" class="small" style="fill:#111">amygdala</text><text x="150" y="482" class="small">learning what matters</text><rect x="283.0" y="419" width="200" height="34" rx="17" class="node"/><text x="383" y="442" class="small" style="fill:#111">striatum and dopamine</text><text x="383" y="482" class="small">wanting, prediction error</text><rect x="516.0" y="419" width="200" height="34" rx="17" class="node"/><text x="616" y="442" class="small" style="fill:#111">hypothalamus</text><text x="616" y="482" class="small">the body's set points</text><rect x="749.0" y="419" width="200" height="34" rx="17" class="node"/><text x="849" y="442" class="small" style="fill:#111">vmPFC and OFC</text><text x="849" y="482" class="small">value, regret, control</text><text x="500" y="545" class="label">Regions participate in functions; none owns one.</text><text x="500" y="570" class="small">One function recruits several networks, and one network serves several functions. Schematic, not anatomy.</text>
