<svg xmlns="http://www.w3.org/2000/svg" width="700" height="322" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">The loop that must stay open</title>
<desc id="desc">Two versions of the same loop. In the open loop, a self-model makes a prediction, which is checked against evidence from the world, meaning other people, failures and surprises, and the result updates the self-model: it is corrected by what it does not control. In the closed loop, the evidence from the world is explained away and blocked, and the check is fed instead by the self-model's own account, filtered to agree, so the self-model grows firmer with every check it passes.</desc>
<rect width="1000" height="460" fill="white"/>
