<svg xmlns="http://www.w3.org/2000/svg" width="700" height="461" viewBox="0 0 1000 658" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Two clocks, one life</title>
<desc id="desc">A logarithmic time axis from one millisecond to eighty years, with bands for spikes, perception and thought, emotion, mood, habit and skill, and temperament and personality. Below it, a jittery fast line labeled s, the activity of the moment, and a thick slowly drifting line labeled w, synaptic strengths, the autobiography. At the bottom, the hippocampus, a fast learner of episodes, and the cortex, a slow learner of structure, exchange information through replay, much of it in sleep.</desc>
